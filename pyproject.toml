[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mylonite"
version = "0.1.0"
description = "Open-source framework for AI-layer security testing — finds AI-agent weaknesses and writes the regression tests that close them."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Abidemi Alade", email = "hello.mylonite@gmail.com" },
]
maintainers = [
    { name = "Abidemi Alade", email = "hello.mylonite@gmail.com" },
]
keywords = [
    "ai-security",
    "llm-security",
    "agentic-security",
    "owasp",
    "mitre-atlas",
    "nist-ai-rmf",
    "mcp",
    "red-team",
    "test-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.40",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
reference-targets = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/Abidemialade/mylonite"
Source = "https://github.com/Abidemialade/mylonite"
Issues = "https://github.com/Abidemialade/mylonite/issues"
Changelog = "https://github.com/Abidemialade/mylonite/blob/main/CHANGELOG.md"

[project.scripts]
mylonite = "mylonite.cli:app"

# Reference plugin entry points. Third-party plugins register against the same
# groups in their own pyproject.toml.
[project.entry-points."mylonite.attack_modules"]
prompt_injection = "mylonite.plugins._reference.prompt_injection_module:PromptInjectionAttackModule"
reference_example = "mylonite.plugins._reference.reference_attack_module:ReferenceAttackModule"

[project.entry-points."mylonite.target_adapters"]
in_process_reference_vulnerable = "mylonite.plugins._reference.reference_target_adapter:InProcessVulnerableReferenceAdapter"
in_process_reference_guarded = "mylonite.plugins._reference.reference_target_adapter:InProcessGuardedReferenceAdapter"

[project.entry-points."mylonite.test_generators"]
reference_pytest = "mylonite.plugins._reference.reference_pytest_generator:ReferencePytestGenerator"

[project.entry-points."mylonite.validators"]
null = "mylonite.plugins._reference.reference_validator:NullValidator"

[project.entry-points."mylonite.compliance_mappers"]
reference = "mylonite.plugins._reference.reference_compliance_mapper:ReferenceComplianceMapper"

# --- Tooling ---------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/mylonite"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mylonite",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH"]
ignore = ["E501"]  # ruff format handles long lines

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["litellm.*", "mcp.*", "mcp_kitchen_sink.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests", "reference_targets/mcp_kitchen_sink/tests"]
asyncio_mode = "auto"
python_classes = ["Test*"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
]

[tool.coverage.run]
source = ["mylonite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mylonite"
version = "0.7.5"
description = "Open-source AI-layer security testing — probes your AI agent for weaknesses and writes a validated regression test for each one it finds, gating CI."
readme = "README.md"
# Upper bound tracks litellm: litellm>=1.83.8 declares Requires-Python
# >=3.10,<3.14, so there is no installable litellm on 3.14. Declaring the
# bound turns a confusing resolver error into a clear "unsupported Python".
# Revisit when litellm supports 3.14 (see the litellm pin below).
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Abidemi Alade", email = "hello.mylonite@gmail.com" },
]
maintainers = [
    { name = "Abidemi Alade", email = "hello.mylonite@gmail.com" },
]
keywords = [
    "ai-security",
    "llm-security",
    "agentic-security",
    "owasp",
    "mitre-atlas",
    "nist-ai-rmf",
    "mcp",
    "red-team",
    "test-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.83.10",  # >=1.83.10 fixes CVE-2026-40217; caps Python <3.14 (see requires-python)
    "jsonschema>=4.22",
    # Rescues non-strict JSON (trailing commas, single quotes, Python literals)
    # that non-Claude / local models emit — fallback after strict parsing.
    "json-repair>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    # MCP stdio transport (v0.2.2). Powers the bundled filesystem / fetch /
    # github targets. The mcp_kitchen_sink reference target still uses this
    # as an optional dep since its in-process server doesn't need wire
    # transport.
    "mcp>=1.0",
    # OS trust-store TLS, BASE dependency: many users sit behind a TLS-inspecting
    # corporate proxy or local AV whose CA lives in the OS store but not in certifi's
    # bundle, so HTTPS to the LLM provider fails with CERTIFICATE_VERIFY_FAILED out of
    # the box. The CLI auto-enables it (mylonite._bootstrap.enable_truststore) — opt
    # out with MYLONITE_NO_TRUSTSTORE=1. Small, pure-Python, zero transitive deps, and
    # a no-op in CI (the OS store already trusts standard CAs). Not "enterprise" — it's
    # the common case; the [enterprise] extra is kept as a back-compat alias.
    "truststore>=0.9",
    # Security floors for litellm's transitive deps (pinned to patched
    # releases; we don't import these directly):
    "aiohttp>=3.14.0",  # CVE-2026-34993, CVE-2026-47265
    "python-dotenv>=1.2.2",  # CVE-2026-28684
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.16",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
]
# The reference target `mcp_kitchen_sink` (a deliberately-vulnerable but FULLY MOCKED
# in-process server — no real I/O, can't bind a network) is NOT a base dependency:
# it is onboarding/test scaffolding, not something a user needs to scan their own app.
# The full test suite imports it, so an editable checkout also needs:
#   pip install -e ".[dev]" && pip install -e ./reference_targets/mcp_kitchen_sink
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Opt-in offline demo: `pip install "mylonite[demo]"` pulls the deliberately-
# vulnerable reference target so `mylonite demo` and `scan reference:*` run with no
# clone and no API key. Kept out of the base install so a plain `pip install mylonite`
# never pulls the vulnerable agent. REQUIRES `mcp-kitchen-sink` to be PUBLISHED to
# PyPI — until then this extra cannot resolve (the graceful CLI error documents both
# this and the editable-checkout path).
demo = [
    "mcp-kitchen-sink>=0.1.0",
]
# Back-compat alias: `truststore` (OS trust store for TLS-inspecting proxies / local
# AV CAs) is now a BASE dependency, so `pip install mylonite` already handles the
# corporate-proxy case out of the box. This extra is kept only so existing
# `pip install "mylonite[enterprise]"` instructions keep working.
enterprise = [
    "truststore>=0.9",
]
[project.urls]
Homepage = "https://github.com/Abidemialade/mylonite"
Source = "https://github.com/Abidemialade/mylonite"
Issues = "https://github.com/Abidemialade/mylonite/issues"
Changelog = "https://github.com/Abidemialade/mylonite/blob/main/CHANGELOG.md"

[project.scripts]
mylonite = "mylonite.cli:app"

# Reference plugin entry points. Third-party plugins register against the same
# groups in their own pyproject.toml.
[project.entry-points."mylonite.attack_modules"]
prompt_injection = "mylonite.plugins._reference.prompt_injection_module:PromptInjectionAttackModule"
excessive_agency = "mylonite.plugins._reference.excessive_agency_module:ExcessiveAgencyAttackModule"
reference_example = "mylonite.plugins._reference.reference_attack_module:ReferenceAttackModule"

[project.entry-points."mylonite.target_adapters"]
in_process_reference_vulnerable = "mylonite.plugins._reference.reference_target_adapter:InProcessVulnerableReferenceAdapter"
in_process_reference_guarded = "mylonite.plugins._reference.reference_target_adapter:InProcessGuardedReferenceAdapter"
mcp_filesystem = "mylonite.plugins._mcp.stdio_adapter:FilesystemMCPAdapter"
mcp_fetch = "mylonite.plugins._mcp.stdio_adapter:FetchMCPAdapter"
mcp_github = "mylonite.plugins._mcp.stdio_adapter:GitHubMCPAdapter"
http_agent = "mylonite.plugins._http.http_adapter:HTTPAgentAdapter"

[project.entry-points."mylonite.test_generators"]
reference_pytest = "mylonite.plugins._reference.reference_pytest_generator:ReferencePytestGenerator"

[project.entry-points."mylonite.validators"]
null = "mylonite.plugins._reference.reference_validator:NullValidator"
differential = "mylonite.plugins._reference.reference_validator:DifferentialValidator"

[project.entry-points."mylonite.compliance_mappers"]
reference = "mylonite.plugins._reference.reference_compliance_mapper:ReferenceComplianceMapper"

# Pytest plugin that registers the markers mylonite-emitted tests carry
# (mylonite_security + the bounded owasp_llm0N / owasp_asi0N set). Auto-loaded
# for any pytest run in an env where mylonite is installed, so emitted tests
# stay warning-free under filterwarnings=error.
[project.entry-points.pytest11]
mylonite = "mylonite.testkit._pytest_plugin"

# --- Tooling ---------------------------------------------------------------

[tool.hatch.build.targets.wheel]
# Base wheel ships ONLY the tool that scans your app. The deliberately-vulnerable
# reference target `mcp_kitchen_sink` is NOT bundled — it is an onboarding/test
# artifact, available opt-in via the `[demo]` extra (see optional-dependencies).
packages = ["src/mylonite"]
# The gate package's data files (mitigations/*.md, fixes/*.md, templates/*.yml) are shipped
# by the default package selection above — hatchling includes all files under a
# selected package. (A force-include here would double-add them and the wheel
# build fails with "a second file is being added".)

[tool.hatch.build.targets.sdist]
include = [
    "src/mylonite",
    "LICENSE",
    "NOTICE",
    "README.md",
    "CHANGELOG.md",
    "SECURITY.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH", "S"]
ignore = ["E501"]  # ruff format handles long lines

[tool.ruff.lint.per-file-ignores]
# Asserts are idiomatic in pytest; subprocess use in dev scripts is deliberate.
# S108/S105 in tests are false positives on fixture data (a literal "/tmp/..."
# exploit-payload path, a fake secret used to test the redactor) — not real
# temp-file or credential handling. "**/tests/**" (not "tests/**") also covers
# reference_targets/mcp_kitchen_sink/tests/, a separate nested pytest suite.
"**/tests/**" = ["S101", "S603", "S607", "S108", "S105"]
"scripts/**" = ["S101", "S603", "S607"]
# S110/S112 here are the documented "best-effort, absence is non-fatal" /
# "sparse grid, missing combos expected" fallbacks already explained inline —
# not silent-and-unexplained swallowing.
"verification/**" = ["S101", "S603", "S607", "S310", "S110", "S112"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["litellm.*", "mcp.*", "mcp_kitchen_sink.*", "truststore.*", "json_repair.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests", "reference_targets/mcp_kitchen_sink/tests"]
# Make the top-level `verification/` harness (excluded from the wheel) importable
# in tests without installing it.
pythonpath = ["."]
asyncio_mode = "auto"
python_classes = ["Test*"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
]

[tool.coverage.run]
source = ["mylonite"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
# Product code only. The deliberately-vulnerable reference targets under
# reference_targets/ are the project's ground-truth oracle and MUST NOT be
# "hardened" (they are intentionally insecure by design); the recorded demo fixtures and
# test fakes are data, not runnable code. The CI security job scans
# `src/mylonite` explicitly; these exclusions keep an ad-hoc `bandit -r .` from
# flagging the intentional vulns or fixtures.
exclude_dirs = [
    "reference_targets",
    "tests",
    ".venv",
    ".wt",
    "src/mylonite/demo/fixtures",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mcp-kitchen-sink"
version = "0.1.0"
description = "Deliberately-vulnerable, fully mocked (network-less) reference MCP agent — the test target for the Mylonite AI-security scanner. NOT for production use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mylonite contributors" },
]
keywords = ["mylonite", "ai-security", "mcp", "test-target", "deliberately-vulnerable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7",
    # ``mcp_kitchen_sink._types`` re-exports the canonical Pydantic models
    # from ``mylonite.scan.llm_types`` (lifted there in v0.2.2 so the MCP
    # stdio adapter and the in-process reference adapter can share a single
    # ``_ServerLike`` Protocol). LiteLLM is no longer a kitchen-sink dep —
    # the LLM planner lives in mylonite now.
    "mylonite",
    # `mcp` SDK is optional at this layer so unit tests that don't need a
    # live MCP server can still run.
]

[project.urls]
Homepage = "https://github.com/Abidemialade/mylonite"
Source = "https://github.com/Abidemialade/mylonite/tree/main/reference_targets/mcp_kitchen_sink"
Issues = "https://github.com/Abidemialade/mylonite/issues"

[project.scripts]
# Real stdio-speaking MCP servers wrapping the in-process reference classes
# (see mcp_kitchen_sink/_stdio_common.py) -- the launchable `command` a
# mylonite `target.yaml` points at. Require the `mcp` extra (`pip install
# -e ".[mcp]"`); importing either entry point without it raises ModuleNotFoundError.
mcp-kitchen-sink-vulnerable = "mcp_kitchen_sink.stdio_vulnerable:main"
mcp-kitchen-sink-guarded = "mcp_kitchen_sink.stdio_guarded:main"

[project.optional-dependencies]
# Upper bound mirrors the root package: mcp 2.0 renamed Tool.inputSchema ->
# input_schema and CallToolResult.isError -> is_error, which this target's
# server shim depends on. Pinned before the first PyPI release because a
# published version's metadata is immutable — shipping an unbounded floor
# would bake the breakage in permanently.
mcp = ["mcp>=1.0,<2.0"]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kitchen_sink"]

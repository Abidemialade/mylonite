# Mylonite per-PR gate — the CHEAP, blocking check.
# Runs the committed .mylonite/gate/ regression test on every PR. For a custom
# target it BOUNDED-re-drives your MCP server (deterministic effect-probe, small
# model, 1 iteration). A regression fails this check, and so does a gate test
# that did not run (MYLONITE_REQUIRE_GATE_RUN).
#
# Requires one secret: MYLONITE_API_KEY (your LLM provider key — mapped below
# to the credential variable the model that found this exploit actually
# needs). Pinned to the model this gate run used; set a MYLONITE_MODEL
# repository variable to change it without editing this file. Changing
# providers also needs a fresh `gate --workflows` run, so the key mapping
# below is re-baked for the new provider.
#
# Enterprise / air-gapped: if your MCP server's backend is behind a corporate
# network, change `runs-on` below to a self-hosted runner inside your perimeter,
# or point target.yaml's env at a CI-reachable staging/mock backend. See
# https://github.com/Abidemialade/mylonite docs: "Enterprise & air-gapped networking".
name: Mylonite gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mylonite-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYLONITE_LIVE_TARGET: "1"
      MYLONITE_REQUIRE_GATE_RUN: "1"
      MYLONITE_REDRIVE_ATTEMPTS: "1"
      MYLONITE_MODEL: ${{ vars.MYLONITE_MODEL || 'anthropic/claude-haiku-4-5-20251001' }}
      ANTHROPIC_API_KEY: ${{ secrets.MYLONITE_API_KEY }}
      # Optional: extra LLM request headers (e.g. a workspace id), as
      # NAME=VALUE pairs. Empty when the repository secret isn't set.
      MYLONITE_LLM_HEADERS: ${{ secrets.MYLONITE_LLM_HEADERS }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install mylonite + pytest
        run: pip install "mylonite==0.10.4" pytest -c .github/workflows/mylonite-constraints.txt
      - name: Run the committed gate test
        run: pytest .mylonite/gate -q -ra

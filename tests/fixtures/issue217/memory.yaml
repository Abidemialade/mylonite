# A "first-time user" custom target.yaml for the official
# @modelcontextprotocol/server-memory reference MCP server (issue #217).
#
# This is a TEST INPUT (docs/superpowers/plans/2026-09-30-no-false-clean.md,
# task T13) — nothing in this repo yet asserts a scan verdict against it.
# That lands with T7 (the judge fix) and T13's own integration test; today
# it exists so those later tests don't have to re-derive it.
#
# Provenance — how a first-time user would actually arrive at this file:
#
# * Launch command, the `search_nodes` verify tool, and the six tools
#   under control_config.consequential_tools: copied from
#   verification/EXTERNAL_DIFFERENTIAL.md's "second proof" table, the
#   in-repo recipe for reproducing #217 against real OSS MCP servers.
#   `search_nodes` is a read tool per the server's own MCP annotations
#   (readOnlyHint: true) and the six consequential tools are exactly what
#   mylonite.scan.control_shim.consequential_tool_names computes from this
#   server's own ToolAnnotations (readOnlyHint: false) — see
#   tests/mcp_plugin/fakes/neutral_servers.py and
#   tests/mcp_plugin/test_scaffold_issue217.py, which pin the scaffold's
#   "Consequential-action tools detected" hint to that same list (#217
#   cause 3).
# * `mylonite scan --scaffold` against this server's live tool surface
#   could NOT auto-suggest a verify_tool: none of server-memory's tool
#   names (create_entities, search_nodes, read_graph, ...) match the
#   scaffold's "reports a side effect" name hints. So a first-time user
#   fills verify_tool in by hand from the table above, and — having no
#   scaffold-computed argument stub to start from for a tool it never
#   proposed — copies docs/target-file.md's Full annotated example
#   (`verify_args_template: {}`) rather than working out search_nodes's
#   own schema. search_nodes REQUIRES a `query` string, so this reproduces
#   #217's "the verify read errors" cause.
# * `expect_marker: "{payload}"` follows docs/target-file.md's current
#   effect_probe guidance verbatim ("a marker the agent's own call
#   carries — the recipient address, a row it wrote, or `{payload}`").
#   That line is what task T14's (deferred) docs fix will change; today it
#   still recommends `{payload}`, which is #217's other cause: a
#   plant-and-recall server reflects the payload back on its own, so the
#   marker can match without the agent having done anything.
# * weakness_classes is narrowed to [W4] (unconfirmed consequential
#   action) — server-memory's app-design flaw here, per
#   EXTERNAL_DIFFERENTIAL.md, is that none of its six state-changing tools
#   confirm or gate the change; W2 needs no seed_arm to probe that, so
#   seed_arm is left undeclared.

family: issue217-memory
command: npx
args: ["-y", "@modelcontextprotocol/server-memory"]
env:
  MEMORY_FILE_PATH: ./.mylonite-issue217/memory.jsonl

weakness_classes: [W4]

primary_tools:
  [
    create_entities,
    create_relations,
    add_observations,
    delete_entities,
    delete_observations,
    delete_relations,
    read_graph,
    search_nodes,
    open_nodes,
  ]

control_config:
  consequential_tools:
    [
      create_entities,
      create_relations,
      add_observations,
      delete_entities,
      delete_observations,
      delete_relations,
    ]

effect_probe:
  verify_tool: search_nodes
  verify_args_template: {}
  expect_marker: "{payload}"
  deferred_markers: ["queued for approval", "pending review"]

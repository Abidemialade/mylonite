name: "Mylonite gate"
description: "Find an AI-layer exploit, validate it, and open a gating regression-test PR."
inputs:
  target-file:
    description: "Path to your Mylonite target YAML."
    required: true
  authorize:
    description: "Authorization scope/family (you must own the target)."
    required: true
  model:
    description: "LiteLLM model id."
    required: false
    default: "claude-haiku-4-5"
  open-pr:
    description: "Open the gating PR (true) or just write artifacts (false)."
    required: false
    default: "true"
  runs-on:
    description: "Runner label baked into the scaffolded gate/discovery workflows (use a self-hosted label for in-perimeter MCP backends). Set the THIS job's runs-on in your own workflow separately."
    required: false
    default: "ubuntu-latest"
  mode:
    description: "discovery (full scan) or gate (informational)."
    required: false
    default: "discovery"
  python-version:
    description: "Python to set up."
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    # SHA-pinned like every action in this repository's own workflows. It
    # matters more here than there: this composite action runs inside OTHER
    # people's CI, so a moved tag would execute new code in every downstream
    # repository at once, with whatever permissions their workflow granted.
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install mylonite
      shell: bash
      run: pip install "mylonite"
    - name: Run mylonite gate
      shell: bash
      # Inputs travel through env, never through `${{ }}` inside `run:`. GitHub
      # substitutes those expressions textually BEFORE bash parses the script,
      # so an input containing a quote or a `;` becomes shell syntax rather than
      # an argument. The caller controls these values, but "the caller" is a
      # workflow that may well wire them from an issue body or a matrix -- and
      # this action runs in their repository, so the injection would be theirs
      # to suffer and ours to have enabled.
      env:
        TARGET_FILE: ${{ inputs.target-file }}
        AUTHORIZE: ${{ inputs.authorize }}
        MODEL: ${{ inputs.model }}
        RUNS_ON: ${{ inputs.runs-on }}
        OPEN_PR: ${{ inputs.open-pr }}
      run: |
        args=(
          --target-file "$TARGET_FILE"
          --authorize "$AUTHORIZE"
          --model "$MODEL"
          --runs-on "$RUNS_ON"
        )
        # Opt-in, and only on an exact match: any other value (including the
        # empty string a caller gets from an unset variable) must not open a PR.
        if [ "$OPEN_PR" = "true" ]; then
          args+=(--open-pr)
        fi
        mylonite gate "${args[@]}"

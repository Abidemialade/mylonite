name: "Mylonite gate"
description: "Find an AI-layer exploit, validate it, and open a gating regression-test PR."
inputs:
  target-file:
    description: "Path to your Mylonite target YAML."
    required: true
  authorize:
    description: "Authorization scope/family (you must own the target)."
    required: true
  model:
    description: "LiteLLM model id (provider-prefixed, e.g. anthropic/claude-haiku-4-5). No default -- see docs/cli-reference.md for the approved providers."  # allow-literal: example
    required: true
  api-key:
    description: "Your LLM provider's API key (e.g. secrets.MYLONITE_API_KEY). Mapped automatically to the credential variable the chosen model's provider needs -- never hardcoded to one provider. Needs mylonite>=0.12.0 once released with this input; on an older pinned release it is a no-op (a ::warning:: says so) and you must export the credential yourself."
    required: true
  llm-headers:
    description: "Optional extra LLM request headers (e.g. a workspace id), as NAME=VALUE pairs, comma- or newline-separated (e.g. secrets.MYLONITE_LLM_HEADERS). Passed through as MYLONITE_LLM_HEADERS."  # allow-literal: example
    required: false
    default: ""
  open-pr:
    description: "Open the gating PR (true) or just write artifacts (false)."
    required: false
    default: "true"
  runs-on:
    description: "Deprecated, no effect: this action never passes --workflows, so mylonite gate has no scaffolded workflow file to put a runner label into. Kept for backward compatibility; a non-default value logs a warning."
    required: false
    default: "ubuntu-latest"
  mode:
    description: "Deprecated, unused: this input is never read by the run step. Kept for backward compatibility; a non-default value logs a warning."
    required: false
    default: "discovery"
  python-version:
    description: "Python to set up."
    required: false
    default: "3.12"
  fail-on:
    description: "Fail this step's own exit code when `mylonite gate` lands on a given result: 'none' (default -- always exits 0, except on an infrastructure failure, which always fails), 'kept' (a proven finding was gated) or 'candidates' (only unproven candidates were found)."
    required: false
    default: "none"
outputs:
  exit-code:
    description: "mylonite gate's raw exit code: 0 (clean), 9 (kept), 10 (candidates), or another code on an infrastructure failure (config, budget, provider, the PR step itself)."
    value: ${{ steps.gate.outputs.exit-code }}
  result:
    description: "clean (exit 0, nothing found), kept (exit 9, a proven finding was gated) or candidates (exit 10, only unproven candidates were found -- nothing committed). Unset when the step failed on an infrastructure code."
    value: ${{ steps.gate.outputs.result }}
runs:
  using: "composite"
  steps:
    # SHA-pinned like every action in this repository's own workflows. It
    # matters more here than there: this composite action runs inside OTHER
    # people's CI, so a moved tag would execute new code in every downstream
    # repository at once, with whatever permissions their workflow granted.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    # Pinned to the release whose tag this action is referenced by
    # (gate-action@vX.Y.Z installs mylonite==X.Y.Z). scripts/prepare_release.py
    # bumps it with __version__, and the release gate refuses a mismatch.
    # constraints.txt is vendored next to this file (never hash-locked --
    # see its own header) so a bad/compromised LiteLLM release doesn't reach
    # every repo that calls this action the day it's published. The path
    # travels through env, like every other input below, rather than
    # interpolated directly into `run:`.
    - name: Install mylonite
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "mylonite==0.11.0" -c "$ACTION_PATH/constraints.txt"
    # The target's own launch `command` decides whether the runner
    # needs Node or uv -- neither is preinstalled the way Python is, and a
    # target launched with npx/uvx otherwise fails to launch with no clearer
    # message than "command not found". Parses the target file with
    # mylonite's own loader (installed above), not a grep: a grep for
    # `^command:` exits 1 (aborting the step under this shell's `-eo
    # pipefail`) on a remote target (transport: sse|http), which declares no
    # `command:` line at all -- and a quoted or absolute-path command
    # needs real YAML + basename handling a line-oriented grep can't give.
    - name: Decide whether the target needs Node or uv
      id: runtime
      shell: bash
      env:
        TARGET_FILE: ${{ inputs.target-file }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path

        github_output = os.environ["GITHUB_OUTPUT"]
        needs = ""
        try:
            from mylonite.plugins._mcp.target_file import load_target_file

            tf = load_target_file(Path(os.environ["TARGET_FILE"]))
            command = Path(tf.command).name if tf.command else ""
            if command in ("npx", "node"):
                needs = "node"
            elif command in ("uvx", "uv"):
                needs = "uv"
        except Exception as exc:
            # A malformed/missing target file is caught properly, with a
            # real error, by the step that actually runs `mylonite gate`
            # below -- this step only decides a CI nicety and must never
            # fail the job itself. Still worth a visible trail: a target
            # whose env: references a placeholder this step can't expand
            # (a ${MYLONITE_TARGET_...} the caller hasn't exported yet)
            # raises here too, and a uvx/npx target that silently lost its
            # runtime setup fails later with nothing clearer than "command
            # not found". Name only the exception TYPE, never str(exc) --
            # a validation error can echo back the offending field's own
            # value, which may not be redacted yet at this point.
            print(
                "::notice::could not read the target file's command to decide "
                f"on a Node/uv setup step ({type(exc).__name__}); continuing "
                "without one"
            )
            needs = ""
        with open(github_output, "a", encoding="utf-8") as f:
            f.write(f"needs={needs}\n")
        PY
    - name: Set up Node (the target launches with npx/node)
      if: ${{ steps.runtime.outputs.needs == 'node' }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: "22"
    - name: Install uv (the target launches with uvx/uv)
      if: ${{ steps.runtime.outputs.needs == 'uv' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install uv -c "$ACTION_PATH/constraints.txt"
    # Maps the api-key input to the credential variable the chosen model's
    # provider actually needs (never hardcoded to Anthropic's), using the
    # approved-provider registry mylonite itself ships -- installed above.
    # This step never writes the key itself anywhere -- not to
    # $GITHUB_ENV (which would expose it to every later step of the
    # CALLER's job, including third-party actions, for the rest of the
    # job) and not to any file. It writes only the credential variable's
    # NAME (never secret-shaped) to $GITHUB_OUTPUT; the one step that
    # actually needs the key (the last step below) exports it into its own
    # process just before calling `mylonite gate`, so the key's scope is
    # that single step.
    - name: Map the API key to the model's provider
      id: keymap
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        python - <<'PY'
        import os

        github_output = os.environ["GITHUB_OUTPUT"]
        model = os.environ.get("MODEL", "")
        var = ""
        try:
            from mylonite.providers.registry import PROVIDERS
            from mylonite.scan.providers import env_vars_for, provider_from_model
        except ImportError:
            # mylonite==0.11.0 (the release this file's install step is
            # pinned to right now) predates the provider registry. Warn and
            # fall back to "unmapped" rather than crash every call until a
            # release with this change bumps the pin -- see the "Install
            # mylonite" step above. Needs mylonite>=0.12.0 once that ships.
            print(
                "::warning::the installed mylonite release has no provider "
                "registry yet (needs mylonite>=0.12.0 once released) -- "
                "api-key is not mapped; export your provider's credential "
                "variable yourself in this job's own env"
            )
        else:
            provider = provider_from_model(model) if model else None
            info = PROVIDERS.get(provider) if provider else None
            key_vars = env_vars_for(provider)

            if not model:
                pass
            elif info is not None and info.local:
                print(
                    f"::warning::provider {provider!r} is local; api-key is "
                    "unused for it"
                )
            elif len(key_vars) == 1:
                var = key_vars[0]
            else:
                reason = (
                    "no registered credential variable" if not key_vars else f"needs {key_vars}"
                )
                print(
                    f"::warning::provider {provider!r} {reason}; this api-key "
                    "input cannot be mapped automatically -- export the right "
                    "variable(s) yourself in this job's own env"
                )
            if info is not None and info.extra_env:
                print(
                    f"::warning::provider {provider!r} also needs {info.extra_env}; "
                    "export those yourself in this job's own env"
                )
        with open(github_output, "a", encoding="utf-8") as f:
            f.write(f"var={var}\n")
        PY
    # `mylonite gate --open-pr` runs `git commit` directly -- a hosted
    # runner has no git identity configured by default, so without this the
    # commit fails on every call that opens a PR.
    - name: Configure git identity for the gating PR
      if: ${{ inputs.open-pr == 'true' }}
      shell: bash
      run: |
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
    - name: Run mylonite gate
      id: gate
      shell: bash
      # Inputs travel through env, never through `${{ }}` inside `run:`. GitHub
      # substitutes those expressions textually BEFORE bash parses the script,
      # so an input containing a quote or a `;` becomes shell syntax rather than
      # an argument. The caller controls these values, but "the caller" is a
      # workflow that may well wire them from an issue body or a matrix -- and
      # this action runs in their repository, so the injection would be theirs
      # to suffer and ours to have enabled.
      env:
        TARGET_FILE: ${{ inputs.target-file }}
        AUTHORIZE: ${{ inputs.authorize }}
        MODEL: ${{ inputs.model }}
        RUNS_ON: ${{ inputs.runs-on }}
        MODE: ${{ inputs.mode }}
        OPEN_PR: ${{ inputs.open-pr }}
        # The key and its variable's name travel separately -- `export`
        # below combines them into this step's own process environment only,
        # never written to $GITHUB_ENV or a file.
        API_KEY: ${{ inputs.api-key }}  # pragma: allowlist secret
        KEY_VAR: ${{ steps.keymap.outputs.var }}
        # Named exactly as mylonite itself reads it -- inherited by the
        # `mylonite gate` subprocess below directly from this step's own
        # environment, never turned into a CLI flag or interpolated into
        # `run:`. Empty (the default) when the input isn't set.
        MYLONITE_LLM_HEADERS: ${{ inputs.llm-headers }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # #198: both `mode` and `runs-on` are deprecated. This action never
        # passes --workflows, so --runs-on has nothing to scaffold with, and
        # `mode` is not read at all — warn rather than silently ignore a
        # non-default value someone set expecting it to do something.
        if [ "$MODE" != "discovery" ]; then
          echo "::warning::the 'mode' input is deprecated and has no effect (unused by this action)"
        fi
        if [ "$RUNS_ON" != "ubuntu-latest" ]; then
          echo "::warning::the 'runs-on' input is deprecated and has no effect (this action never passes --workflows, so mylonite gate has nothing to scaffold with it)"
        fi
        # Both must be non-empty: a caller who already exports the key at
        # job level and wires `api-key` to an unset secret would otherwise
        # have that real key overwritten with an empty string here.
        if [ -n "$KEY_VAR" ] && [ -n "$API_KEY" ]; then
          export "$KEY_VAR=$API_KEY"
        fi
        # Drop the key from its original name too, so it doesn't travel
        # under a second name into the `mylonite gate` subprocess tree.
        unset API_KEY
        args=(
          --target-file "$TARGET_FILE"
          --authorize "$AUTHORIZE"
        )
        # GitHub does not actually enforce `required: true` on a composite
        # action's input -- a caller can still wire an empty string (an
        # unset secret/variable, a blank matrix cell). `--model ""` exits 2
        # ("invalid --model") instead of the clearer exit 4 + approved-
        # provider-list message a genuinely MISSING model gets, so only pass
        # the flag at all when there is something to pass.
        if [ -n "$MODEL" ]; then
          args+=(--model "$MODEL")
        fi
        # Opt-in, and only on an exact match: any other value (including the
        # empty string a caller gets from an unset variable) must not open a PR.
        if [ "$OPEN_PR" = "true" ]; then
          args+=(--open-pr)
        fi
        # mylonite gate's own exit code separates a clean run (0), a kept
        # finding (9, including one already proposed by an earlier run) and
        # unproven candidates only (10) from an infrastructure failure (any
        # other code -- config, budget, provider, the PR step itself). The
        # first three are a successful RUN of this action; only the caller,
        # via fail-on, decides whether any of them should fail the STEP.
        set +e
        mylonite gate "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        case "$code" in
          0)  result=clean ;;
          9)  result=kept ;;
          10) result=candidates ;;
          *)  exit "$code" ;;
        esac
        echo "result=$result" >> "$GITHUB_OUTPUT"
        case "$result" in
          clean)      echo "::notice::Mylonite: nothing found." ;;
          kept)       echo "::notice::Mylonite kept a proven finding; see the gate pull request." ;;
          candidates) echo "::warning::Mylonite found unproven candidates (not committed); the log says how to prove each." ;;
        esac
        if [ "$FAIL_ON" = "$result" ]; then
          exit "$code"
        fi

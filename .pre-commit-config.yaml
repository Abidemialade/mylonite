repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The baseline allowlists known test fakes + recorded demo fixtures.
        # Exclude the venv/worktree/baseline so they aren't re-flagged.
        exclude: ^(\.wt/|\.venv/|\.secrets\.baseline$|\.security/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - typer>=0.12
          - rich>=13.7
          - types-PyYAML
          - types-jsonschema

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        # -ll matches the CI `security` job's threshold (medium+ severity): the
        # 10 Low-severity findings currently in src/ are the same asserts/
        # subprocess calls already noqa'd for ruff S101/S603, tracked for P9/P12.
        # Gating pre-commit on Low would block every commit until those land.
        args: ["-c", "pyproject.toml", "-ll", "-r", "src"]
        additional_dependencies: ["bandit[toml]"]

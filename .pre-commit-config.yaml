repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      # `main` is protected on GitHub (PR required, enforce_admins on), so a
      # direct push is rejected — but nothing stopped a direct COMMIT locally,
      # and work accumulated on `main` that could never be pushed and had to be
      # untangled afterwards. This moves the failure to the first commit, where
      # it costs one `git switch -c`, instead of the first push.
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # The baseline allowlists known test fakes + recorded demo fixtures.
        # Exclude the venv/worktree/baseline so they aren't re-flagged.
        exclude: ^(\.wt/|\.venv/|\.secrets\.baseline$|\.security/)

  - repo: local
    hooks:
      # Strips the baseline's volatile metadata, which is what made this hook
      # pair fail a commit and pass on the retry.
      #
      # Paths: detect-secrets records findings under the separator of whichever
      # OS ran it, so a Windows contributor emits `docs\quarry.md` where CI
      # expects `docs/quarry.md` and previously-audited findings read as new.
      #
      # Line numbers: detect-secrets rewrites the baseline whenever a recorded
      # finding's line number shifts, and pre-commit fails any hook that
      # modifies a tracked file regardless of exit code. Storing `line_number:
      # 0` ("not provided") makes it skip the comparison, so an unrelated edit
      # no longer rewrites the file. A new secret is still caught earlier and
      # unconditionally -- see scripts/normalize_secrets_baseline.py.
      #
      # Runs immediately after detect-secrets so the baseline is normalised
      # before it is staged.
      - id: normalize-secrets-baseline
        name: normalize secrets baseline to POSIX paths
        entry: python scripts/normalize_secrets_baseline.py
        language: system
        pass_filenames: false
        files: ^\.secrets\.baseline$
        always_run: true

      # `detect-secrets` above catches credentials. This catches the other thing
      # that has twice escaped into public files: prose describing the
      # maintainer's own machine (antivirus product, that a live API key was in
      # their shell, that their TLS is intercepted). For a security tool those
      # lines profile the person holding commit and publishing rights, and the
      # first occurrence had to be removed with a force-push after the fact.
      #
      # Markdown only, deliberately: `control_shim.py` and `labels.py` say "this
      # session" about an MCP scan session. Flagging those would train people to
      # bypass the hook. See the script's docstring.
      - id: no-local-context
        name: no local-machine context in committed prose or results
        entry: python scripts/check_no_local_context.py
        language: system
        # `files:`, NOT `types: [markdown]`. The guard also covers committed
        # verification results (JSON/JSONL under verification/results/), and a
        # markdown-only type filter means pre-commit never hands it those --
        # the rule would then exist but fire only in CI's no-argument run, which
        # is the kind of half-installed guard that reads as protection without
        # being any.
        files: '\.md$|^verification/results/.*\.(json|jsonl)$'

      # The deliberately-vulnerable reference target is the one place in this
      # repository where insecure code is expected, which makes it the cheapest
      # place to disguise a real backdoor: "it's intentional, see the seed
      # catalogue" is unfalsifiable by eye. This asserts the property that keeps
      # the two separable -- the package is inert, so it cannot reach the
      # network, spawn a process, or execute constructed code, and every tool it
      # exposes is catalogued and has a guarded counterpart.
      #
      # always_run with pass_filenames: false because three of its four checks
      # are cross-file (a tool added to one server, a seed pointing at a symbol
      # in another); handing it only the changed paths would miss exactly the
      # inconsistencies it exists to find.
      - id: reference-target-inert
        name: reference target stays inert and fully catalogued
        entry: python scripts/check_reference_target_inert.py
        language: system
        pass_filenames: false
        always_run: true

  # Lints the workflows themselves. Everything else in this file checks the code
  # CI runs; nothing checked CI's own definition, where a mistake is worse --
  # a workflow can grant a token, run untrusted input, or disable a gate, and it
  # is the one file that can silence every other check here.
  #
  # zizmor is security-specific (unpinned action refs, credential persistence,
  # template-injection sinks, over-broad permissions); actionlint catches the
  # ordinary breakage (bad expressions, unknown keys, shellcheck on `run:`).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Keep in lockstep with the `ruff==` pin in pyproject's [dev] extra. CI runs
  # both paths -- the `lint` job installs ruff from that pin, the `precommit`
  # job runs this hook -- so a drift between them lets one job pass while the
  # other fails on the same file.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - typer>=0.12
          - rich>=13.7
          - types-PyYAML
          - types-jsonschema

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        # -ll matches the CI `security` job's threshold (medium+ severity): the
        # 10 Low-severity findings currently in src/ are the same asserts/
        # subprocess calls already noqa'd for ruff S101/S603, tracked for P9/P12.
        # Gating pre-commit on Low would block every commit until those land.
        # pass_filenames: false — bandit already recurses -r src itself; without
        # this, pre-commit appends the changed filenames after -r src and bandit
        # scans them twice (verified: 12 findings instead of 10 with a filename
        # tacked on), producing confusing duplicate output on every commit.
        args: ["-c", "pyproject.toml", "-ll", "-r", "src"]
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]

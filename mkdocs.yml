site_name: Mylonite
site_description: Open-source framework for AI-layer security testing.
site_url: https://abidemialade.github.io/mylonite/
repo_url: https://github.com/Abidemialade/mylonite
repo_name: Abidemialade/mylonite

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - The Quarry (try it): quarry.md
  - The validation engine: validation.md
  - CI gating: ci-gating.md
  - Enterprise networking: enterprise-networking.md
  - Concepts: concepts.md
  - Plugin authoring: plugin-authoring.md
  - Standards mapping: standards-mapping.md
  - Security: security.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

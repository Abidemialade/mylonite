site_name: Mylonite
site_description: Open-source framework for AI-layer security testing.
site_url: https://abidemialade.github.io/mylonite/
repo_url: https://github.com/Abidemialade/mylonite
repo_name: Abidemialade/mylonite

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Local-only working artefacts (brainstorming specs / implementation plans) live
# under docs/superpowers/ and must never be published — exclude them from the
# site build so they can't render even if present locally. They are gitignored
# too, so they aren't in CI at all.
exclude_docs: |
  superpowers/

# Peripheral pages intentionally not in the main nav (a dev/contributing guide and an
# internal asset note) — listed here so `--strict` doesn't flag them as orphaned.
not_in_nav: |
  /assets/recording-script.md
  /contributing/live-e2e-tests.md

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Installing on Windows: install-windows.md
      - Try it — the reference app: quarry.md
  - Guides:
      - Test your own app: test-your-app.md
      - Test a plain HTTP agent: http-agent.md
      - Gate CI: ci-gating.md
      - Reading the results: reading-results.md
  - How it works:
      - Weakness classes & how attacks work: weakness-classes.md
      - Attack modes: attack-modes.md
      - The validation engine: validation.md
      - Independent verification: verification.md
      - Concepts: concepts.md
      - Standards mapping: standards-mapping.md
  - Reference:
      - CLI reference: cli-reference.md
      - target.yaml reference: target-file.md
      - Architecture & modules: architecture.md
      - Plugin authoring: plugin-authoring.md
  - Operating:
      - Enterprise networking: enterprise-networking.md
      - Self-hosted models (Ollama/vLLM): self-hosted-models.md
      - Security & responsible use: security.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

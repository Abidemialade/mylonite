name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Mypy
        run: mypy src

  docs-consistency:
    # Guards the command examples embedded IN THE CODE (cli.py's --help epilogs,
    # demo/render.py's printed next-step text) against the real Typer app. Runs in
    # main CI (not docs.yml, which only triggers on docs/** changes) specifically
    # because a cli.py-only change -- a renamed/removed flag, a dropped command --
    # never touches docs/ and would otherwise never trip a docs check at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Embedded CLI examples parse against the real app
        run: pytest tests/test_docs_consistency.py -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest --cov=mylonite --cov-report=xml --cov-report=term-missing
      - name: Precision/recall corpus (differential oracle)
        # Measures the oracle's FP/FN against the seeded kitchen-sink twins
        # (offline, no LLM). The asserted numbers live in tests/corpus; this
        # surfaces the measured precision/recall/FPR and the report artefact.
        run: python scripts/measure_precision_recall.py --out corpus_report.json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload corpus report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-report
          path: corpus_report.json

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so detect-secrets can be run over it locally
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
          pip install bandit pip-audit==2.7.3 detect-secrets
      - name: Bandit (SAST, product code, medium+ severity)
        run: bandit -ll -r src/mylonite
      - name: detect-secrets (tracked tree vs committed baseline)
        run: git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
      - name: pip-audit (dependency CVEs, informational)
        # Not --strict: this job installs mcp-kitchen-sink editable from a local
        # path (it isn't published to PyPI yet — see pyproject.toml's `demo`
        # extra comment), which pip-audit always reports as an un-auditable
        # skip. --strict promotes ANY skip to a hard failure, even a skip
        # produced by the deliberate --skip-editable flag (verified locally),
        # so a strict gate here would fail on every run regardless of real
        # CVEs. Verified locally against this exact dependency set
        # (pip install -e ".[dev]" + -e ./reference_targets/mcp_kitchen_sink):
        # `pip-audit` reports "No known vulnerabilities found". Revisit
        # --strict once mcp-kitchen-sink is published to PyPI.
        continue-on-error: true
        run: pip-audit

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest --cov=mylonite --cov-report=xml --cov-report=term-missing
      - name: Precision/recall corpus (differential oracle)
        # Measures the oracle's FP/FN against the seeded kitchen-sink twins
        # (offline, no LLM). The asserted numbers live in tests/corpus; this
        # surfaces the measured precision/recall/FPR and the report artefact.
        run: python scripts/measure_precision_recall.py --out corpus_report.json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload corpus report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: corpus_report.json

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so detect-secrets can be run over it locally
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
          pip install bandit pip-audit detect-secrets
      - name: Bandit (SAST, product code, medium+ severity)
        run: bandit -ll -r src/mylonite
      - name: detect-secrets (tracked tree vs committed baseline)
        run: git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
      - name: pip-audit (dependency CVEs, informational)
        continue-on-error: true
        run: pip-audit

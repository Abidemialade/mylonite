name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml so the TAGGED commit is verified by this exact suite
  # before anything is published. A `tags:` trigger here would NOT do the same
  # job: the two workflows would race with no ordering between them, and PyPI
  # could publish before the test matrix finished — a guarantee in appearance
  # only. Being called makes CI a hard dependency of the publish chain.
  workflow_call:

permissions:
  contents: read

concurrency:
  # NOTE: inside a called workflow, `github.workflow` resolves to the CALLER's
  # name, so a release run groups as "Release-refs/tags/vX.Y.Z". That is fine
  # while release.yml declares no top-level `concurrency:` — but do not give it
  # one using this same expression, or the release would land in this group and
  # cancel-in-progress would have it cancel its own CI.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request touches anything but docs. A docs-only PR
  # still runs the full suite once (3.12 on Linux), because many tests read the
  # README, CHANGELOG and docs/; it skips the other Python legs and Windows,
  # which a docs change cannot affect differently. Pushes to main and release runs
  # (workflow_call) always run everything.
  #
  # Steps are skipped rather than whole jobs for `test`/`test-windows`: a
  # skipped MATRIX job reports one unexpanded check ("test"), so the required
  # "test (3.11)" would never report and would block the merge. `demo` is not
  # in that required-checks list, so it skips outright instead -- see its own
  # comment below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          [ -z "$changed" ] && code=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|mkdocs.yml|LICENSE|NOTICE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "$changed"; echo "code=$code"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Mypy
        run: mypy src

  build:
    # Builds the distribution on every PR. Before this job, `python -m build` ran
    # ONLY inside release.yml, so anything that broke packaging — a bad
    # [tool.hatch.version] path, a missing sdist include, unreadable metadata —
    # was first discovered mid-release, after a tag had already been pushed.
    # The version is hatch-dynamic (read from src/mylonite/version.py), so a
    # mistake there fails here loudly instead of publishing a wrong version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        # twine must stay current: 6.2.0 and earlier overwrite packaging's
        # _VALID_METADATA_VERSIONS with a hardcoded list ending at "2.4", so they
        # reject the Metadata-Version 2.5 that current hatchling emits.
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Built version matches src/mylonite/version.py
        # Proves the dynamic-version wiring is live: if [tool.hatch.version].path
        # were repointed or the build fell back to some other source, the produced
        # filenames would not carry this version and `ls` fails.
        run: |
          expected=$(python -c "import sys; sys.path.insert(0,'scripts'); import release_version; print(release_version.package_version())")
          echo "version.py declares $expected"
          ls "dist/mylonite-$expected.tar.gz" "dist/mylonite-$expected-py3-none-any.whl"

  docs-build-strict:
    # No path filter, deliberately: this must run on EVERY PR and push to main,
    # docs-only included. docs.yml's old `docs-build` job filtered on
    # `docs/**`/`mkdocs.yml`, which worked for "does this PR's own docs change
    # build", but a job gated that way can never become a GitHub required
    # check -- a required check that is SKIPPED (not run) on a PR that doesn't
    # touch those paths blocks the merge forever, since GitHub only treats a
    # required check as satisfied when it reports a result. Unconditional here
    # means it is safe to mark required later. docs.yml keeps the separate
    # `deploy` job (push to main only, needs write creds this job must not have).
    #
    # Kept fast on purpose: pip's cache plus installing only the `[docs]` extra
    # (mkdocs-material and friends), not the full `[dev]` dependency set this
    # job never needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build the docs (strict)
        run: mkdocs build --strict

  nr-ci:
    # No-regression gate, stage 1 (see docs/contributing/CONTRIBUTING.md's "No-
    # regression checks" section). No path filter and no `if:` here,
    # deliberately: this must run -- and report a result -- on EVERY PR and
    # push to main, docs-only included, so it is safe to mark required. See
    # docs-build-strict's comment above for why a conditionally-skipped job can
    # never become a required check. Kept to one Python (3.12) on ubuntu and a
    # handful of cheap steps so it stays well under the ~3-minute budget.
    runs-on: ubuntu-latest
    env:
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: CLI goldens (command tree, dry-run seed listings, demo replay)
        run: pytest tests/cli_golden -q
      - name: No hardcoded provider model or credential env var
        run: python scripts/check_no_hardcoded_models.py
      - name: "Demo replay wall time (bar: 10s)"
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        # Shared runners are noisy: one slow run alone doesn't fail the bar;
        # two in a row do. A hung demo is killed after 60s.
        run: |
          for attempt in 1 2; do
            start_ms=$(date +%s%3N)
            timeout 60s mylonite demo > /dev/null
            end_ms=$(date +%s%3N)
            elapsed_ms=$((end_ms - start_ms))
            echo "demo replay wall time (attempt ${attempt}): ${elapsed_ms}ms"
            if [ "$elapsed_ms" -le 10000 ]; then
              exit 0
            fi
          done
          echo "::error::demo replay took over the 10000ms (10s) bar twice in a row (last: ${elapsed_ms}ms)"
          exit 1
      - name: Test count floor (never drops without the tests-removed label)
        run: python scripts/check_test_count.py --labels-env PR_LABELS

  nr-ci-e2e:
    # No-regression gate, stage 2: the deepest offline path, end to end. A
    # reference scan replayed from recordings, its finding through the real
    # generator and differential validator, then the emitted test run under
    # pytest. The same run checks the gate's LLM call count against the
    # committed baseline, and the labelled corpus checks every recorded
    # verdict against its ground truth.
    #
    # No path filter and no `if:`, like `nr-ci`: it must report on every PR,
    # docs-only included, so it can be made required. No provider key is set,
    # so a replay that fell through to a live call fails instead of spending.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYLONITE_OFFLINE_E2E: "1"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # uv comes from PyPI at a pinned version: the repository's Actions policy
      # allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install
        run: |
          python -m pip install "uv==0.12.19"
          uv pip install --system -e ".[dev]" -e ./reference_targets/mcp_kitchen_sink
      - name: Offline deep path, labelled corpus and LLM call counts
        run: pytest tests/e2e/test_offline_deep_path.py tests/corpus tests/test_llm_call_count.py -q

  nr-ci-e2e-windows:
    # The same offline deep path on Windows, in parallel with the Linux job.
    # Windows is where path, encoding and subprocess differences show up, and
    # the main Windows test job skips this path to keep its wall time down.
    # Always runs and always reports, like `nr-ci-e2e`.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MYLONITE_OFFLINE_E2E: "1"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # uv comes from PyPI at a pinned version: the repository's Actions policy
      # allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install
        run: |
          python -m pip install "uv==0.12.19"
          uv pip install --system -e ".[dev]" -e ./reference_targets/mcp_kitchen_sink
      - name: Offline deep path, labelled corpus and LLM call counts
        run: pytest tests/e2e/test_offline_deep_path.py tests/corpus tests/test_llm_call_count.py -q

  docs-consistency:
    # Guards the command examples embedded IN THE CODE (cli.py's --help epilogs)
    # against the real Typer app. Runs in
    # main CI (not docs.yml, which only triggers on docs/** changes) specifically
    # because a cli.py-only change -- a renamed/removed flag, a dropped command --
    # never touches docs/ and would otherwise never trip a docs check at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Embedded CLI examples parse against the real app
        run: pytest tests/test_docs_consistency.py -q

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # 3.12 always runs; the other legs only when code changed (see `changes`).
      RUN_TESTS: ${{ needs.changes.outputs.code == 'true' || matrix.python-version == '3.12' }}
    steps:
      - if: env.RUN_TESTS != 'true'
        run: echo "Docs-only change; the 3.12 leg runs the suite."
      - if: env.RUN_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.RUN_TESTS == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # uv comes from PyPI at a pinned version: the repository's Actions policy
      # allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install
        if: env.RUN_TESTS == 'true'
        run: |
          python -m pip install "uv==0.12.19"
          uv pip install --system -e ".[dev]" -e ./reference_targets/mcp_kitchen_sink
      # Parallel across the runner's cores; `worksteal` rebalances the few slow
      # tests (each starts a fresh gate run) instead of queueing them on one
      # worker. Coverage is measured on the 3.12 leg only, the one that uploads it.
      - name: Pytest
        if: env.RUN_TESTS == 'true' && matrix.python-version == '3.12'
        run: pytest -n auto --dist worksteal --cov=mylonite --cov-report=xml --cov-report=term-missing
      - name: Pytest
        if: env.RUN_TESTS == 'true' && matrix.python-version != '3.12'
        run: pytest -n auto --dist worksteal
      - name: Precision/recall corpus (differential oracle)
        if: env.RUN_TESTS == 'true'
        # Measures the oracle's FP/FN against the seeded kitchen-sink twins
        # (offline, no LLM). The asserted numbers live in tests/corpus; this
        # surfaces the measured precision/recall/FPR and the report artefact.
        run: python scripts/measure_precision_recall.py --out corpus_report.json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload corpus report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-report
          path: corpus_report.json

  test-windows:
    needs: changes
    runs-on: windows-latest
    env:
      RUN_TESTS: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.RUN_TESTS != 'true'
        run: echo "Docs-only change; the Linux 3.12 leg runs the suite."
      - if: env.RUN_TESTS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.RUN_TESTS == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # uv comes from PyPI at a pinned version: the repository's Actions policy
      # allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install
        if: env.RUN_TESTS == 'true'
        run: |
          python -m pip install "uv==0.12.19"
          uv pip install --system -e ".[dev]" -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        if: env.RUN_TESTS == 'true'
        run: pytest -n auto --dist worksteal

  # The zero-key on-ramp, exercised unskipped on every PR.
  #
  # This job exists because the demo's failure mode is SILENT. A stale or missing
  # fixture does not raise on its own: `_llm`'s fallback chain and the adapter's
  # skip-conversion swallow exceptions from `completion_fn` (see the
  # `mylonite._replay` module docstring), so a miss degrades the VULNERABLE scan
  # to a clean result and the demo cheerfully reports that the deliberately
  # vulnerable app is fine. `demo/runner.py` catches this by inspecting recorder
  # state after each variant; this job is what makes sure that check actually
  # runs against the fixtures we ship.
  #
  # `tests/integration/test_demo_recorded.py` SKIPS when fixtures are absent, so
  # a green pytest run does not cover this. Do not "fix" a red demo job by
  # widening that skip - re-record instead:
  #   python scripts/record_demo_fixtures.py     (needs a provider key)
  #
  # Gated on `changes.outputs.code`, unlike `test`/`test-windows`: this job is
  # not in the branch ruleset's required status checks, so unlike those two it
  # can skip outright (no echo step) on a docs-only PR without leaving a
  # required check unreported.
  demo:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux and Windows: the README's first command is a uvx one-liner, and
    # Windows is where a console encoding or a wrap would break it for a user.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so `set -o pipefail`, `tee` and `grep` below mean
        # the same thing on both runners.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest supported Python, so the one-liner is proven where a new
      # user is most likely to be. uvx runs on the interpreter on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # uv comes from PyPI at a pinned version: the repository's Actions policy
      # allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install uv
        run: python -m pip install "uv==0.12.19"
      - name: Run the offline demo through uvx (no API key set)
        # The README's one-liner, run from this checkout instead of PyPI. uvx
        # builds `.[demo]` into a throwaway environment, and the `[demo]` extra's
        # `==` pin pulls the PUBLISHED mcp-kitchen-sink wheel -- the same
        # property the pip install step below relies on (see its comment).
        #
        # No provider key in the environment on purpose: if replay ever fell
        # through to a live call, this step must fail rather than quietly spend.
        #
        # `pipefail` is load-bearing: without it `uvx ... | tee` reports
        # tee's exit status, so a demo that FAILED would be recorded as passing
        # and this whole job would become decorative. It is set explicitly so the
        # step does not depend on the runner's default shell flags.
        #
        # COLUMNS=80 is the claim under test: a default terminal. The demo puts
        # the headline ("reference app: N exploits on vulnerable, M on guarded")
        # and the `mode: replay` line on lines of their own and truncates
        # nothing, so the next step's greps must hold at 80 columns. This used to
        # be 200 only to keep Rich from wrapping the headline; an 80-column run
        # that needs a wider terminal to pass is now a failure.
        #
        # The retry loop covers PyPI index lag right after a mcp-kitchen-sink
        # release (see #199): the `[demo]` extra's `==` pin can name a version
        # uv's resolver can't see yet on the index edge it hits, for up to about
        # ten minutes. Each attempt's output goes to demo-output.txt only via
        # `tee`, so a failed attempt's partial or empty output is overwritten by
        # the next attempt rather than read by the next step's greps. `pipefail`
        # makes the pipeline report the demo's exit status, not `tee`'s, so
        # `break` only fires once the demo actually succeeded.
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          COLUMNS: "80"
        run: |
          set -o pipefail
          for i in 1 2 3 4 5; do
            uvx --from ".[demo]" mylonite demo | tee demo-output.txt && break
            if [ "$i" = 5 ]; then
              echo "::error::demo failed via uvx after 5 attempts (PyPI index lag right after a mcp-kitchen-sink release is the known cause -- see #199)."
              exit 1
            fi
            echo "uvx demo failed (attempt $i); retrying in 30s in case the PyPI index is still catching up"
            sleep 30
          done
      - name: The vulnerable twin must actually find something
        # Exit code alone is not enough. The staleness guard detects fixture
        # MISSES, not SILENCE: if drift ever made the vulnerable variant issue
        # zero LLM calls (every seed skipped, or an adapter short-circuit),
        # cache_misses stays 0, nothing raises, and the demo renders the
        # deliberately vulnerable app as clean. That is the exact failure this
        # whole subsystem exists to prevent, so assert the differential is real
        # rather than trusting a zero exit code.
        run: |
          if ! grep -Eq '[1-9][0-9]* exploits on vulnerable' demo-output.txt; then
            echo "::error::demo did not report a non-zero finding count on the VULNERABLE twin."
            echo "Either the fixtures are stale in a way that produces silence rather than a"
            echo "miss, or the headline line changed shape. Both need a human."
            sed -n '1,40p' demo-output.txt
            exit 1
          fi
          if ! grep -q "mode: replay" demo-output.txt; then
            echo "::error::demo did not report replay mode; it may have attempted a live call."
            exit 1
          fi
          # An ellipsis means Rich cut a cell to fit 80 columns. `-F` matches the
          # UTF-8 bytes literally (the demo forces UTF-8 stdout), which does not
          # depend on the runner's locale -- Git Bash on Windows included.
          if grep -Fq '…' demo-output.txt; then
            echo "::error::demo output is truncated at 80 columns (found an ellipsis)."
            grep -Fn '…' demo-output.txt
            exit 1
          fi
      - name: Install via the [demo] extra, against the PUBLISHED reference app
        # Linux only: this install exists for the missing-fixture check below,
        # which needs the fixtures at a known site-packages path.
        if: runner.os == 'Linux'
        # Deliberately NOT `pip install -e ./reference_targets/mcp_kitchen_sink`.
        #
        # The replay cache key folds in `tools`, and those tool schemas come from
        # mcp-kitchen-sink. Installing the local editable copy would validate the
        # fixtures against the working tree -- which is never what a user has.
        # `pip install ".[demo]"` resolves the `==` pin and pulls the PUBLISHED
        # wheel, so this job reproduces the actual `pip install "mylonite[demo]"`
        # experience the README offers.
        #
        # That closes the more likely break. The `==` pin defends against a
        # FUTURE kitchen-sink release; it cannot defend against the local and
        # published 0.1.0 being different bytes, which is what happens the first
        # time someone edits a tool description in reference_targets/ without a
        # version bump. Under this job that lands as a red demo here instead of a
        # 100% fixture miss for every user of the extra.
        #
        # The `test` and `test-windows` jobs still install the local editable
        # copy, so ordinary development of the reference target is unaffected.
        #
        # The retry loop covers the same PyPI index lag as the uvx step above
        # (see #199), with one addition this step needs and the uvx step
        # doesn't: `cache: pip` on this job's setup-python restores pip's HTTP
        # cache from an earlier run, which can hold a conditionally-cached
        # index page for mcp-kitchen-sink from before the new version
        # published. A plain retry would keep revalidating against that same
        # stale cache entry, so `pip cache purge` runs between attempts to
        # force the next one onto the network instead of a cached response.
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5; do
            pip install ".[demo]" && break
            if [ "$i" = 5 ]; then
              echo "::error::pip install \".[demo]\" failed after 5 attempts (PyPI index lag right after a mcp-kitchen-sink release is the known cause -- see #199)."
              exit 1
            fi
            echo "pip install failed (attempt $i); purging pip's cache in case it's serving a stale index page, then retrying in 30s"
            pip cache purge
            sleep 30
          done
          python -c "import mcp_kitchen_sink, importlib.metadata as m; print('kitchen-sink', m.version('mcp-kitchen-sink'), 'from', mcp_kitchen_sink.__file__)"
      - name: The pip route must find something too
        # Positive control for the check below: the documented `pip install`
        # route has to work before a failing demo there can mean anything. If
        # this install broke for an unrelated reason, the missing-fixture check
        # would go green for the wrong reason.
        if: runner.os == 'Linux'
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          COLUMNS: "80"
        run: |
          if ! mylonite demo > pip-demo.txt; then
            echo "::error::demo failed after pip install \".[demo]\" with every fixture present."
            sed -n '1,40p' pip-demo.txt
            exit 1
          fi
          if ! grep -Eq '[1-9][0-9]* exploits on vulnerable' pip-demo.txt; then
            echo "::error::the pip-installed demo did not report a non-zero finding count on the VULNERABLE twin."
            sed -n '1,40p' pip-demo.txt
            exit 1
          fi
      - name: A missing fixture must fail loudly, not render a clean result
        if: runner.os == 'Linux'
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          python - <<'EOF'
          import pathlib, sys
          from mylonite.demo import packaged_fixture_dir

          # Resolve the INSTALLED fixtures, exactly as the demo does. The obvious
          # `src/mylonite/demo/fixtures/...` is wrong here: this job installs the
          # project non-editably, so the demo reads from site-packages and hiding
          # a source-tree file changes nothing. That is not hypothetical -- it is
          # how this step failed the first time it ran against a real install,
          # reporting a broken guard when the guard was fine.
          root = pathlib.Path(str(packaged_fixture_dir())) / "vulnerable"
          if not root.is_dir():
              sys.exit(f"installed fixtures not found at {root} - cannot test staleness")
          picks = sorted(p for p in root.glob("*.json") if p.name != "_meta.json")
          if not picks:
              sys.exit(f"no vulnerable fixtures in {root} - nothing to test staleness against")
          victim = picks[0]
          victim.rename(victim.with_suffix(".json.hidden"))
          print(f"hid {victim} (installed copy)")
          EOF
          if mylonite demo; then
            echo "::error::demo SUCCEEDED with a missing fixture - the staleness guard is broken."
            echo "A miss must surface via the runner's recorder-state inspection, not render clean."
            exit 1
          fi
          echo "demo correctly refused to run with a missing fixture"

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        # `no-commit-to-branch` is a LOCAL guard (block direct commits to main on
        # a dev machine). In CI it fires whenever the job runs on the `main`
        # branch itself (every push to main), which is not a real failure — skip
        # it here so main's CI reflects the actual checks.
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run actionlint (manual stage)
        # actionlint is pinned to `stages: [manual]` so it does not drag a Go
        # toolchain onto a contributor's machine -- see the note in
        # .pre-commit-config.yaml. That means the run above skips it, so it is
        # invoked here by name. This runner has Go, and the workflows are
        # exactly the files that must not go unlinted.
        run: pre-commit run --hook-stage manual actionlint --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so detect-secrets can be run over it locally
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
          pip install bandit pip-audit==2.7.3 detect-secrets
      - name: Bandit (SAST, product code, medium+ severity)
        run: bandit -ll -r src/mylonite
      - name: detect-secrets (tracked tree vs committed baseline)
        run: git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
      - name: pip-audit (dependency CVEs)
        # Not --strict: this job installs mcp-kitchen-sink editable from a local
        # path (even though it's also published to PyPI as `mcp-kitchen-sink`,
        # this CI job always installs the in-repo checkout so it tests THIS
        # commit's copy), which pip-audit always reports as an un-auditable
        # skip. --strict promotes ANY skip to a hard failure, even a skip
        # produced by the deliberate --skip-editable flag (verified locally),
        # so a strict gate here would fail on every run regardless of real
        # CVEs. Verified locally against this exact dependency set
        # (pip install -e ".[dev]" + -e ./reference_targets/mcp_kitchen_sink):
        # `pip-audit` reports "No known vulnerabilities found".
        #
        # This step used to carry `continue-on-error: true`, which did more than
        # the comment above justified: dropping --strict already prevents the
        # editable-skip false failure, so the flag was additionally swallowing
        # REAL vulnerabilities. pip-audit exits non-zero on an actual finding
        # regardless of --strict, so removing it turns this back into a gate. If
        # a CVE lands with no fix available yet, add a scoped
        # `--ignore-vuln <ID>` with a comment, so the exception is visible and
        # dated rather than blanket.
        run: pip-audit

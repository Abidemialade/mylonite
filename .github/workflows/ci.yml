name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml so the TAGGED commit is verified by this exact suite
  # before anything is published. A `tags:` trigger here would NOT do the same
  # job: the two workflows would race with no ordering between them, and PyPI
  # could publish before the test matrix finished — a guarantee in appearance
  # only. Being called makes CI a hard dependency of the publish chain.
  workflow_call:

permissions:
  contents: read

concurrency:
  # NOTE: inside a called workflow, `github.workflow` resolves to the CALLER's
  # name, so a release run groups as "Release-refs/tags/vX.Y.Z". That is fine
  # while release.yml declares no top-level `concurrency:` — but do not give it
  # one using this same expression, or the release would land in this group and
  # cancel-in-progress would have it cancel its own CI.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Mypy
        run: mypy src

  build:
    # Builds the distribution on every PR. Before this job, `python -m build` ran
    # ONLY inside release.yml, so anything that broke packaging — a bad
    # [tool.hatch.version] path, a missing sdist include, unreadable metadata —
    # was first discovered mid-release, after a tag had already been pushed.
    # The version is hatch-dynamic (read from src/mylonite/version.py), so a
    # mistake there fails here loudly instead of publishing a wrong version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        # twine must stay current: 6.2.0 and earlier overwrite packaging's
        # _VALID_METADATA_VERSIONS with a hardcoded list ending at "2.4", so they
        # reject the Metadata-Version 2.5 that current hatchling emits.
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Built version matches src/mylonite/version.py
        # Proves the dynamic-version wiring is live: if [tool.hatch.version].path
        # were repointed or the build fell back to some other source, the produced
        # filenames would not carry this version and `ls` fails.
        run: |
          expected=$(python -c "import sys; sys.path.insert(0,'scripts'); import release_version; print(release_version.package_version())")
          echo "version.py declares $expected"
          ls "dist/mylonite-$expected.tar.gz" "dist/mylonite-$expected-py3-none-any.whl"

  docs-consistency:
    # Guards the command examples embedded IN THE CODE (cli.py's --help epilogs)
    # against the real Typer app. Runs in
    # main CI (not docs.yml, which only triggers on docs/** changes) specifically
    # because a cli.py-only change -- a renamed/removed flag, a dropped command --
    # never touches docs/ and would otherwise never trip a docs check at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Embedded CLI examples parse against the real app
        run: pytest tests/test_docs_consistency.py -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest --cov=mylonite --cov-report=xml --cov-report=term-missing
      - name: Precision/recall corpus (differential oracle)
        # Measures the oracle's FP/FN against the seeded kitchen-sink twins
        # (offline, no LLM). The asserted numbers live in tests/corpus; this
        # surfaces the measured precision/recall/FPR and the report artefact.
        run: python scripts/measure_precision_recall.py --out corpus_report.json
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload corpus report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-report
          path: corpus_report.json

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Pytest
        run: pytest

  # The zero-key on-ramp, exercised unskipped on every PR.
  #
  # This job exists because the demo's failure mode is SILENT. A stale or missing
  # fixture does not raise on its own: `_llm`'s fallback chain and the adapter's
  # skip-conversion swallow exceptions from `completion_fn` (see the
  # `mylonite._replay` module docstring), so a miss degrades the VULNERABLE scan
  # to a clean result and the demo cheerfully reports that the deliberately
  # vulnerable app is fine. `demo/runner.py` catches this by inspecting recorder
  # state after each variant; this job is what makes sure that check actually
  # runs against the fixtures we ship.
  #
  # `tests/integration/test_demo_recorded.py` SKIPS when fixtures are absent, so
  # a green pytest run does not cover this. Do not "fix" a red demo job by
  # widening that skip - re-record instead:
  #   python scripts/record_demo_fixtures.py     (needs a provider key)
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./reference_targets/mcp_kitchen_sink
      - name: Run the offline demo (no API key set)
        # No provider key in the environment on purpose: if replay ever fell
        # through to a live call, this step must fail rather than quietly spend.
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: mylonite demo
      - name: A missing fixture must fail loudly, not render a clean result
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          python - <<'EOF'
          import pathlib, random, sys
          root = pathlib.Path("src/mylonite/demo/fixtures/vulnerable")
          picks = sorted(p for p in root.glob("*.json") if p.name != "_meta.json")
          if not picks:
              sys.exit("no vulnerable fixtures found - nothing to test staleness against")
          victim = picks[0]
          victim.rename(victim.with_suffix(".json.hidden"))
          print(f"hid {victim.name}")
          EOF
          if mylonite demo; then
            echo "::error::demo SUCCEEDED with a missing fixture - the staleness guard is broken."
            echo "A miss must surface via the runner's recorder-state inspection, not render clean."
            exit 1
          fi
          echo "demo correctly refused to run with a missing fixture"

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run pre-commit
        # `no-commit-to-branch` is a LOCAL guard (block direct commits to main on
        # a dev machine). In CI it fires whenever the job runs on the `main`
        # branch itself (every push to main), which is not a real failure — skip
        # it here so main's CI reflects the actual checks.
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files --show-diff-on-failure

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history so detect-secrets can be run over it locally
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./reference_targets/mcp_kitchen_sink
          pip install bandit pip-audit==2.7.3 detect-secrets
      - name: Bandit (SAST, product code, medium+ severity)
        run: bandit -ll -r src/mylonite
      - name: detect-secrets (tracked tree vs committed baseline)
        run: git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
      - name: pip-audit (dependency CVEs, informational)
        # Not --strict: this job installs mcp-kitchen-sink editable from a local
        # path (even though it's also published to PyPI as `mcp-kitchen-sink`,
        # this CI job always installs the in-repo checkout so it tests THIS
        # commit's copy), which pip-audit always reports as an un-auditable
        # skip. --strict promotes ANY skip to a hard failure, even a skip
        # produced by the deliberate --skip-editable flag (verified locally),
        # so a strict gate here would fail on every run regardless of real
        # CVEs. Verified locally against this exact dependency set
        # (pip install -e ".[dev]" + -e ./reference_targets/mcp_kitchen_sink):
        # `pip-audit` reports "No known vulnerabilities found".
        continue-on-error: true
        run: pip-audit

name: Docs

# Publishes the live site to GitHub Pages on pushes to main. The strict build that
# used to run here on every PR (including docs-only ones) now lives in ci.yml as
# `docs-build-strict`, unconditionally rather than path-filtered -- see that job's
# comment for why. This workflow now only ever runs on push to main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Read-only by default. `deploy` is the only job and widens it only for its own
# steps -- see the note there.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `mkdocs gh-deploy` pushes to the gh-pages branch, so this job needs BOTH
  # `contents: write` and the credentials that checkout persists into
  # .git/config -- scoped to this job only, via the job-level `permissions:`
  # below, so nothing else in the workflow run gets a write-scoped token.
  #
  # `if:` on the job (not just the step) matters: a step-level guard would still
  # have the job's write permission granted for the whole run.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-deploy pushes the built site to the gh-pages branch
    steps:
      # The one checkout in this repository that deliberately KEEPS credentials:
      # `mkdocs gh-deploy` pushes via the git remote, so persisting the token is
      # the mechanism, not an oversight. Safe here specifically because this job
      # runs only on push to main -- it never checks out pull-request code, so
      # there is no contributor-authored step to read them. (checkout v6+ keeps
      # credentials under $RUNNER_TEMP rather than .git/config; still readable by
      # a step in the same job, just less obviously so.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # Publish to https://abidemialade.github.io/mylonite/
      - run: mkdocs gh-deploy --force --strict

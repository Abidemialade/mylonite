name: Docs

# Build the docs (strict) on every PR so a broken link or missing nav entry fails the
# check, and publish the live site to GitHub Pages on pushes to main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

# Read-only by default. Only `deploy` widens it, and only for pushes to main --
# see the note on that job.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on pull requests, including from forks, so it executes contributor-
  # authored content (docs macros, mkdocs plugins). It therefore gets nothing:
  # a read-only token, and no credentials left in .git/config.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # Fail on broken nav/links/anchors so docs can't rot.
      - run: mkdocs build --strict

  # Split from `build` deliberately. `mkdocs gh-deploy` pushes to the gh-pages
  # branch, so this job needs BOTH `contents: write` and the credentials that
  # checkout persists into .git/config -- the two things the build job must not
  # have. While one job served both triggers, every pull-request run was handed
  # a write-scoped token it had no use for.
  #
  # `if:` on the job (not just the step) matters: a step-level guard would still
  # have the job's write permission granted for the whole run.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-deploy pushes the built site to the gh-pages branch
    steps:
      # The one checkout in this repository that deliberately KEEPS credentials:
      # `mkdocs gh-deploy` pushes via the git remote, so persisting the token is
      # the mechanism, not an oversight. Safe here specifically because this job
      # runs only on push to main -- it never checks out pull-request code, so
      # there is no contributor-authored step to read .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # Publish to https://abidemialade.github.io/mylonite/
      - run: mkdocs gh-deploy --force --strict

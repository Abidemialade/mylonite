name: Docs

# Build the docs (strict) on every PR so a broken link or missing nav entry fails the
# check, and publish the live site to GitHub Pages on pushes to main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: write # gh-deploy pushes the built site to the gh-pages branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # PRs: fail on broken nav/links/anchors so docs can't rot.
      - name: Build (strict)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict
      # main: publish the live site to https://abidemialade.github.io/mylonite/
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force --strict

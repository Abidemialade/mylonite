name: Sensitive paths

# Makes CODEOWNERS mean something. Branch protection sets
# `required_approving_review_count: 0` with `enforce_admins: true`, so no review
# is required and the sole maintainer could not satisfy one anyway (nobody can
# approve their own pull request). Rather than leave the trust base unguarded,
# this fails on any pull request touching a file that controls what the
# project's own checks do, until a maintainer applies an override label.
#
# See scripts/check_sensitive_paths.py for the file list and the reasoning.

on:
  pull_request:
    # `labeled` / `unlabeled` are load-bearing: without them, applying the
    # override label would not re-run this check, and the pull request would sit
    # on a stale red result with no way to clear it short of an empty push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: sensitive-paths-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the check diffs against the merge base, and the
          # default shallow clone has no commit in common with the base branch
          # to diff against.
          fetch-depth: 0
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"
      - name: Check for trust-base changes
        env:
          BASE_REF: ${{ github.base_ref }}
          # Via env, never interpolated into the shell: label names are
          # attacker-influenceable text, and `${{ }}` inside a `run:` block is
          # pasted in before the shell parses it.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python scripts/check_sensitive_paths.py \
            --base-ref "origin/$BASE_REF" \
            --labels "$PR_LABELS"

name: Release (mcp-kitchen-sink)

# The deliberately-vulnerable reference target ships as its OWN PyPI package
# (`mcp-kitchen-sink`), installed alongside `mylonite` by anyone who wants to
# run `scan reference:*` against it. It is released independently of
# `mylonite` on a separate `ks-v*` tag prefix, so a routine `mylonite` release
# never republishes the vulnerable agent (and vice versa).
#
# Setup required once on PyPI/TestPyPI before the first run — see
# reference_targets/mcp_kitchen_sink/PUBLISHING.md.

on:
  push:
    tags:
      - "ks-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  gate:
    # Same pre-publish gate as release.yml, pointed at this package. --no-changelog
    # because mcp-kitchen-sink deliberately keeps no CHANGELOG of its own: it is a
    # single-purpose 0.1.0 fixture released roughly never, and its changes are
    # already narrated in the root CHANGELOG.md. A second Keep-a-Changelog file
    # would just be a second thing to forget.
    name: Version consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag, __init__.py and pyproject all agree
        run: |
          python scripts/prepare_release.py --check \
            --tag "${GITHUB_REF_NAME}" \
            --tag-prefix ks-v \
            --package reference_targets/mcp_kitchen_sink \
            --no-changelog

  build:
    name: Build sdist + wheel
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        # twine must stay current: 6.2.0 and earlier reject the Metadata-Version
        # 2.5 that current hatchling emits.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build reference_targets/mcp_kitchen_sink --outdir dist
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-kitchen-sink
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-kitchen-sink
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-kitchen-sink
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

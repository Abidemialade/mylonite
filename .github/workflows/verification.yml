# Third-party verification — OPT-IN larger-N runs.
#
# Deliberately NOT triggered on push/PR: it spends LLM tokens and hits the network.
# It runs on a manual dispatch or a weekly schedule, and answers the small-sample
# limitation by running a larger N than a quick manual check (Gap 4).
#
# The hermetic verification checks (judge-agreement on the committed fixture, the
# crosswalk/catalogue/scorer tests) already run in the normal test job via
# `tests/verification/` — they need no secrets and gate every PR. THIS workflow is
# only for the live numbers.
#
# Requires repo secret ANTHROPIC_API_KEY. Layer 1 (DVMCP) is intentionally omitted:
# it executes a deliberately-vulnerable external server, which should be run
# manually with explicit authorization, not on a schedule.
name: verification

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "cases per InjecAgent split"
        default: "100"
      model:
        description: "litellm model id"
        default: "anthropic/claude-haiku-4-5-20251001"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  layer2-3-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Guard — require a key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set; skipping live verification."
            exit 1
          fi
      - name: Layer 2 — InjecAgent (faithful ASR + judge agreement)
        run: |
          LIMIT="${{ github.event.inputs.limit || '100' }}"
          MODEL="${{ github.event.inputs.model || 'anthropic/claude-haiku-4-5-20251001' }}"
          python -m verification.runner fetch --dataset injecagent
          for split in dh ds; do
            python -m verification.runner record --dataset injecagent --split "$split" \
              --model "$MODEL" --limit "$LIMIT" --out "verification/reports/${split}.jsonl"
            python -m verification.runner score --transcripts "verification/reports/${split}.jsonl" \
              --out "verification/reports/layer2_${split}.json"
          done
      - name: Layer 3 — precision on reference:guarded (expect 0 false positives)
        run: |
          MODEL="${{ github.event.inputs.model || 'anthropic/claude-haiku-4-5-20251001' }}"
          python -m mylonite scan reference:guarded --provider anthropic \
            --model "${MODEL#anthropic/}" --output-dir verification/reports/layer3/guarded
          python -m verification.runner layer3 score --scan verification/reports/layer3/guarded \
            --target reference:guarded --out verification/reports/layer3_precision.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: verification/reports/**/*.json

# Third-party verification campaign: proves the product works on systems
# Mylonite has never run against before (verification/SOURCE.md,
# verification/PREREG_THIRD_PARTY_2026_10.md and, for the `tier`/`pattern`
# inputs and the three `e2e-*` precision targets below,
# verification/PREREG_E2E_2026_10.md), with every LLM call made in CI.
#
# Manual dispatch only, EXACTLY one target and one provider per dispatch --
# no "all"/"both" fan-out and no free-text model override (both were cut
# after review: an unbounded fan-out times an unbounded --max-llm-calls
# times an overridable model was an unbounded spend). The model is fixed
# per tier x provider below (the `tier` input is `small` (unchanged) or
# `mid`, never a model string) -- the one place that mapping lives is the
# "Resolve the fixed model" step. The `pattern` input is the CLI's own
# existing --weakness-class filter (one of W1/W2/W3/W4, or blank),
# hard-validated against that allowlist in "Validate inputs" before any
# step that could spend. scan's own --max-llm-calls is fixed at 60 and
# validate's --iterations is fixed at 3 -- neither is dispatch-configurable
# any more. What IS dispatch-configurable, and hard-clamped, is each
# process's own MYLONITE_MAX_LLM_REQUESTS ceiling (scan_ceiling <= 150,
# validate_ceiling <= 100; see the prereg's "Pilot procedure" for how the
# real values get set from one uncounted dispatch before any counted run).
# MYLONITE_MAX_LLM_REQUESTS is Mylonite's own hard ceiling on LLM requests
# for one process, retries included (#282; also the global
# --max-llm-requests flag). When a process reaches it, Mylonite stops,
# prints one [MYL-ABT-001] line and exits 3, and the result is NOT TESTED.
# See the prereg's "Budget and the hard ceiling" section for the worst-case
# math. The job's 30-minute timeout and a provider-side spend cap stay as
# the outer stops (the ceiling counts requests, not dollars).
#
# Every live cell needs a repo secret (MYLONITE_LLM_KEY for Anthropic,
# MYLONITE_OPENAI_KEY for OpenAI) and a dispatch with the matching key unset
# does nothing (a `::notice::`, not a failure) -- the same env-plus-shell
# guard pattern verification-campaign.yml and live-smoke.yml use. GitHub
# does not allow a `secrets` reference inside a step `if:` at all ("Unrecognized
# named-value: 'secrets'") -- the guard step below reads both keys into its
# OWN `env:` (scoped to that one step, purely to test non-emptiness) and
# tests them in its shell script, never in an `if:`. The `ollama` provider
# choice needs no key: it is valid only for target=tpv-server-memory (the
# roadmap's zero-cost cell), rejected for any other target.
#
# The real provider key used to drive Mylonite lives in the `env:` of ONE
# step only -- the step that actually runs `mylonite scan`/`generate`/
# `validate`. Every per-target server-launch step, the Ollama pull, the
# shim start-up and the scaffold check carry neither key. (The guard step
# above also briefly holds both keys, in its own env, solely to check
# whether each is empty -- an unavoidable, minimal second exposure: GitHub
# gives no other way to test a secret's presence outside an `if:`.)
# Residual risk, stated plainly: the MCP stdio adapter's env allowlist
# blocks direct inheritance into a spawned server, but on Linux a same-uid
# child can still read /proc/<pid>/environ of its parent -- use dedicated,
# spend-limited keys for this workflow, not a shared production one.
#
# None of scan/generate/validate's own non-zero exit codes are allowed to
# fail the "Run the real journey" step -- they are captured and handed to
# the scorer instead (an aborted scan, a rejected/not-kept validate, or an
# actual crash are all legitimate, scoreable outcomes, not step failures).
# The scoring and cost steps run with `if: always()` so they still produce
# score.json/cost.json for exactly those outcomes.
#
# Builds a wheel from `ref` and installs it into a clean venv outside the
# checkout, exactly like verification-campaign.yml, so this measures a real
# release build rather than a working tree. Writes nothing to the
# repository: every artefact (the scaffold sanity-check, run log,
# scan/validation reports, score.json, cost.json, the prereg commit this run
# was judged against) is uploaded, never committed from here -- a
# maintainer reviews and commits the results separately.
name: third-party-campaign

on:
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Exactly one target (verification/SOURCE.md and
          verification/PREREG_E2E_2026_10.md). e2e-guarded-reference,
          e2e-readonly-time and e2e-readonly-b are the precision cells
          (verification/PREREG_E2E_2026_10.md): no finding on any of them is
          ever a vulnerability, so a KEPT result there is scored as a false
          positive to triage, never published as a real finding.
          e2e-reference-w1 is the breadth cell on the in-repo reference app
          (that file's "Breadth cell 1"), not a precision cell: a KEPT result
          there may be a real finding to adjudicate like any other cell.
        required: true
        type: choice
        options:
          - tpv-server-memory
          - tpv-mcp-redis
          - tpv-streamablehttp
          - tpv-server-everything
          - tpv-go-memory
          - tpv-agents-sdk-ollama
          - e2e-guarded-reference
          - e2e-readonly-time
          - e2e-readonly-b
          - e2e-reference-w1
      provider:
        description: >-
          Exactly one provider. 'ollama' is valid ONLY with
          target=tpv-server-memory (rejected for every other target).
        required: true
        type: choice
        options:
          - anthropic
          - openai
          - ollama
      tier:
        description: >-
          Model tier. 'small' is the original campaign's pins (no change).
          'mid' is the breadth tier (verification/PREREG_E2E_2026_10.md's
          "Models" section): claude-sonnet-5 / gpt-5.1, never free text --
          the tier x provider -> model id mapping is fixed in one place
          below ("Resolve the fixed model"). Ignored (always the small-tier
          Ollama model) when provider=ollama: there is no mid-tier Ollama
          cell in the plan.
        required: true
        type: choice
        options:
          - small
          - mid
        default: small
      pattern:
        description: >-
          Optional single weakness-class filter (W1/W2/W3/W4), passed through
          to the CLI's existing --weakness-class flag (mylonite.scan.weakness
          -- filters a target's declared weakness_classes; naming a class the
          target doesn't declare matches nothing and the CLI refuses before
          any spend). Blank runs every class the target declares, as before.
          Validated against the W1-W4 allowlist before any step that could
          spend; a bad value fails the "Validate inputs" step. Unused for
          target=e2e-reference-w1: that cell is pinned to --weakness-class W1
          by the workflow itself (verification/PREREG_E2E_2026_10.md's
          "Breadth cell 1"), whatever this input is set to.
        required: false
        default: ""
      scan_ceiling:
        description: >-
          Per-process hard LLM-request ceiling for the scan phase
          (MYLONITE_MAX_LLM_REQUESTS), clamped to <=150. scan's own soft
          --max-llm-calls stays fixed at 60 regardless of this value. The
          default (60) is set from the pilot; see the prereg's "Pilot
          result" subsection for the measured spend and the reasoning.
        required: true
        type: number
        default: 60
      validate_ceiling:
        description: >-
          Per-process hard LLM-request ceiling for the validate phase
          (MYLONITE_MAX_LLM_REQUESTS), clamped to <=100. validate's own
          --iterations stays fixed at 3 regardless of this value. The
          default (40) is set from the pilot; see the prereg's "Pilot
          result" subsection.
        required: true
        type: number
        default: 40
      ref:
        description: "branch, tag or sha to build and measure"
        default: "main"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7@sha256:95acc00495ddacfec75111ba47021f903121a890311d49264c723b4423ac9601
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Pinned by digest, started as a service container rather than an
      # unpinned `curl ... | sh` install script. Always started (even for a
      # target/provider combo that doesn't need it) -- simpler than a
      # conditional service, and the extra container costs only a few
      # seconds of job time.
      ollama:
        image: ollama/ollama:0.35.0@sha256:9c1dc45ea758396139ec0adfa52947714c61f8d1e4537a6e2daef8138e7a64a9
        ports:
          - 11434:11434
    env:
      # Every later step reads the dispatch's target/provider through these,
      # never through a bare ${{ }} inside a run: script -- a dispatch input
      # is free text, substituted before bash parses the line, and several
      # steps in this job hold a provider key (see the file header).
      TPV_TARGET: ${{ inputs.target }}
      TPV_PROVIDER: ${{ inputs.provider }}
      TPV_TIER: ${{ inputs.tier }}
      TPV_PATTERN: ${{ inputs.pattern }}
    steps:
      - name: Validate inputs -- hard-clamp both ceilings; reject a bad target/provider/pattern combo
        id: inputs
        shell: bash
        env:
          TPV_SCAN_CEILING_RAW: ${{ inputs.scan_ceiling }}
          TPV_VALIDATE_CEILING_RAW: ${{ inputs.validate_ceiling }}
        run: |
          # Inlined twice rather than factored into a shell function: a
          # function's `exit` inside a `$(...)` command substitution only
          # terminates that subshell, not this step, which would silently
          # swallow a bad-input error instead of failing the step on it.

          scan_ceiling="$TPV_SCAN_CEILING_RAW"
          case "$scan_ceiling" in
            ''|*[!0-9]*)
              echo "::error::scan_ceiling must be a positive integer, got '$scan_ceiling'"
              exit 1
              ;;
          esac
          if [ "$scan_ceiling" -lt 1 ]; then scan_ceiling=1; fi
          if [ "$scan_ceiling" -gt 150 ]; then
            echo "::notice::scan_ceiling $scan_ceiling exceeds the hard cap of 150 (see verification/PREREG_THIRD_PARTY_2026_10.md's Pilot procedure); clamping to 150."
            scan_ceiling=150
          fi
          echo "scan_ceiling=$scan_ceiling" >> "$GITHUB_OUTPUT"

          validate_ceiling="$TPV_VALIDATE_CEILING_RAW"
          case "$validate_ceiling" in
            ''|*[!0-9]*)
              echo "::error::validate_ceiling must be a positive integer, got '$validate_ceiling'"
              exit 1
              ;;
          esac
          if [ "$validate_ceiling" -lt 1 ]; then validate_ceiling=1; fi
          if [ "$validate_ceiling" -gt 100 ]; then
            echo "::notice::validate_ceiling $validate_ceiling exceeds the hard cap of 100 (see verification/PREREG_THIRD_PARTY_2026_10.md's Pilot procedure); clamping to 100."
            validate_ceiling=100
          fi
          echo "validate_ceiling=$validate_ceiling" >> "$GITHUB_OUTPUT"

          if [ "$TPV_PROVIDER" = "ollama" ] && [ "$TPV_TARGET" != "tpv-server-memory" ]; then
            echo "::error::provider=ollama is only valid with target=tpv-server-memory (see the prereg)."
            exit 1
          fi

          # --weakness-class (mylonite.scan.weakness.WEAKNESS_CLASSES): exact,
          # uppercase W1-W4, or blank. Checked here -- before checkout, before
          # any key is even read -- so a typo refuses the whole dispatch
          # rather than spending on a flag the CLI itself would also refuse.
          case "$TPV_PATTERN" in
            ''|W1|W2|W3|W4) ;;
            *)
              echo "::error::pattern must be one of W1/W2/W3/W4 (exact, uppercase) or blank, got '$TPV_PATTERN'."
              exit 1
              ;;
          esac

      # No `secrets.*` in this (or any) step's `if:` -- GitHub rejects that
      # outright ("Unrecognized named-value: 'secrets'"), which would stop
      # the whole workflow from loading. Both keys are read into THIS
      # step's own env, purely to test non-emptiness in the shell script,
      # following the exact env-plus-shell pattern verification-campaign.yml
      # and live-smoke.yml already use.
      - name: Guard -- do nothing (not fail) if the required key is unset
        id: guard
        shell: bash
        env:
          TPV_ANTHROPIC_KEY_PRESENT: ${{ secrets.MYLONITE_LLM_KEY }}
          TPV_OPENAI_KEY_PRESENT: ${{ secrets.MYLONITE_OPENAI_KEY }}
        run: |
          case "$TPV_PROVIDER" in
            anthropic)
              if [ -z "$TPV_ANTHROPIC_KEY_PRESENT" ]; then
                echo "::notice::MYLONITE_LLM_KEY is not set; skipping $TPV_TARGET (anthropic)."
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            openai)
              if [ -z "$TPV_OPENAI_KEY_PRESENT" ]; then
                echo "::notice::MYLONITE_OPENAI_KEY is not set; skipping $TPV_TARGET (openai)."
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            ollama)
              : # no key needed
              ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the checked-out commit (the artefacts cite a commit SHA, not the `ref` text)
        if: steps.guard.outputs.run == 'true'
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"

      # Node only for the three @modelcontextprotocol/* servers (targets 1, 4,
      # and e2e-readonly-b, which reuses target 4's own binary -- see
      # verification/SOURCE.md's e2e-readonly-b row).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: >-
          steps.guard.outputs.run == 'true' && (
            env.TPV_TARGET == 'tpv-server-memory' ||
            env.TPV_TARGET == 'tpv-server-everything' ||
            env.TPV_TARGET == 'e2e-readonly-b'
          )
        with:
          node-version: "22"

      # The tier x provider -> model id mapping lives HERE ONLY -- the one
      # place verification/PREREG_E2E_2026_10.md's "Models" table and this
      # workflow must agree. 'small' is the unchanged original-campaign
      # pin; 'mid' is the breadth tier. ollama ignores tier: there is no
      # mid-tier Ollama cell in the plan, and the "Validate inputs" step
      # above already refuses ollama for any target but tpv-server-memory.
      - name: Resolve the fixed model for this tier/provider (no override)
        if: steps.guard.outputs.run == 'true'
        id: model
        shell: bash
        run: |
          case "$TPV_PROVIDER" in
            ollama)
              echo "model=ollama_chat/llama3.2:3b" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "$TPV_TIER:$TPV_PROVIDER" in
            # Unchanged from the first campaign (verification/SOURCE.md).
            small:anthropic) echo "model=anthropic/claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT" ;;
            small:openai)    echo "model=openai/gpt-4o-mini" >> "$GITHUB_OUTPUT" ;;
            # the breadth tier's mid model (verification/PREREG_E2E_2026_10.md's "Models"
            # section). The OpenAI side is gpt-5.1, NOT gpt-6.1-sol --
            # gpt-6.1-sol is OpenAI's own current mid-tier label, but its
            # tool/function calling only works through the Responses API,
            # not the Chat Completions shape LiteLLM's completion() call
            # (mylonite.scan.llm_planner) uses, so it cannot drive Mylonite's
            # planner at all. See the prereg's "OpenAI mid tier" section for
            # the full verification trail.
            mid:anthropic)   echo "model=anthropic/claude-sonnet-5" >> "$GITHUB_OUTPUT" ;;
            mid:openai)      echo "model=openai/gpt-5.1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown tier/provider combination $TPV_TIER/$TPV_PROVIDER"; exit 1 ;;
          esac

      - name: Build the wheel and install it into a clean venv
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/campaign-venv"
          "$RUNNER_TEMP/campaign-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/campaign-venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/mylonite-*.whl
          echo "MYLONITE=$RUNNER_TEMP/campaign-venv/bin/mylonite" >> "$GITHUB_ENV"

      # --- per-target launch (no provider keys in any of these) -------------

      - name: "Target 1: a fresh, throwaway memory-file path"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'tpv-server-memory'
        shell: bash
        run: echo "TPV_MEMORY_FILE=$RUNNER_TEMP/tpv-memory-$RANDOM.json" >> "$GITHUB_ENV"

      - name: "Target 1 or target 6's own inference, or an explicit ollama cell: pull the model"
        if: steps.guard.outputs.run == 'true' && (env.TPV_PROVIDER == 'ollama' || env.TPV_TARGET == 'tpv-agents-sdk-ollama')
        shell: bash
        run: |
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:11434/api/pull -d '{"name":"llama3.2:3b","stream":false}'

      - name: "Target 2: install redis/mcp-redis (its own console script, not `python -m` from an arbitrary cwd)"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'tpv-mcp-redis'
        shell: bash
        # redis:7's own health check above already blocks every step in this
        # job until the service is healthy; redis-cli isn't on this runner's
        # host image, so no separate host-side wait loop belongs here.
        run: |
          git clone --quiet https://github.com/redis/mcp-redis.git "$RUNNER_TEMP/mcp-redis"
          git -C "$RUNNER_TEMP/mcp-redis" checkout --quiet 11e67e44358cd6410d5a7e615a29539ccd71a045
          python -m pip install "$RUNNER_TEMP/mcp-redis"

      - name: "Target 3: start the python-sdk simple-streamablehttp server"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'tpv-streamablehttp'
        shell: bash
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/modelcontextprotocol/python-sdk.git "$RUNNER_TEMP/python-sdk"
          git -C "$RUNNER_TEMP/python-sdk" checkout --quiet 9972c21aa42054fb1450c5fc614761ed11847ec6
          python -m pip install -e "$RUNNER_TEMP/python-sdk/examples/servers/simple-streamablehttp"
          mcp-simple-streamablehttp --port 3000 &
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:3000/mcp && break; sleep 1; done

      - name: "Target 5: build the Go SDK's own memory example"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'tpv-go-memory'
        shell: bash
        # Built into verification/third_party/ -- the SAME directory as
        # go_memory.yaml, not $GITHUB_WORKSPACE -- because that target file
        # declares `command: ./tpv-go-memory`, a relative path, and
        # mylonite#187/ab26542c ("resolve a target file's relative paths
        # against its own directory") now anchors every target file's
        # relative command/args against the loaded YAML's own directory,
        # not the caller's cwd. Building to $GITHUB_WORKSPACE (this
        # workflow's previous behaviour, before that product fix landed)
        # left `./tpv-go-memory` pointing at
        # verification/third_party/tpv-go-memory, which this build step
        # never created -- "Run the real journey" then got
        # [MYL-PRE-003] AdapterDescribeFailed trying to spawn a binary that
        # wasn't there, even though the unrelated Scaffold sanity check
        # below passed (it launches the binary through an explicit
        # `--command` flag, which keeps resolving against the caller's own
        # cwd -- see that product fix's own commit message). Building here
        # instead keeps both launch paths -- the scaffold check's
        # `--command` flag below and the real run's `--target-file`
        # relative `command:` -- pointed at the one binary, with no
        # `$GITHUB_WORKSPACE`-relative special case left over in either.
        run: |
          go version
          git clone --quiet https://github.com/modelcontextprotocol/go-sdk.git "$RUNNER_TEMP/go-sdk"
          git -C "$RUNNER_TEMP/go-sdk" checkout --quiet 3f3b699b2b67e1ed033a63d6651671dab53c2d32
          (cd "$RUNNER_TEMP/go-sdk/examples/server/memory" && go build -o "$GITHUB_WORKSPACE/verification/third_party/tpv-go-memory" .)
          # No -memory flag above: the knowledge graph stays in-process only.

      - name: "Target 6: start the disclosed Agents-SDK/Ollama shim (pinned deps)"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'tpv-agents-sdk-ollama'
        shell: bash
        env:
          OLLAMA_API_BASE: http://127.0.0.1:11434
          MYLONITE_TPV_OLLAMA_MODEL: llama3.2:3b
        run: |
          # The agent under test gets its own virtualenv: it is the target, not
          # Mylonite, and its openai-agents pin needs a newer `openai` than the
          # LiteLLM Mylonite uses. Sharing one environment made pip refuse both.
          python -m venv "$RUNNER_TEMP/tpv-shim-venv"
          SHIM_PY="$RUNNER_TEMP/tpv-shim-venv/bin/python"
          "$SHIM_PY" -m pip install --quiet "openai-agents[litellm]==0.22.3" "fastapi==0.142.2" "uvicorn==0.54.0"
          "$SHIM_PY" -m uvicorn verification.third_party.shims.openai_agents_ollama_shim:app \
            --host 127.0.0.1 --port 8099 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8099/docs && break; sleep 1; done

      # --- precision-cell targets (verification/PREREG_E2E_2026_10.md) -----------
      # No finding on any of these three is ever a vulnerability -- a KEPT
      # result here is scored as a false positive, never published as a real
      # finding (see the "target" input's own description above).

      - name: "e2e-guarded-reference: install the kitchen-sink guarded twin as a real stdio server"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'e2e-guarded-reference'
        shell: bash
        # The REAL stdio server (mcp-kitchen-sink-guarded, its own console
        # script), not the in-process reference:guarded adapter -- this cell
        # exercises Mylonite's stdio adapter against the guarded twin exactly
        # the way it exercises every other third-party target, rather than
        # the in-process reference path other scans already cover.
        run: python -m pip install "./reference_targets/mcp_kitchen_sink[mcp]"

      - name: "e2e-readonly-time: install the official MCP time server into its own venv (pinned mcp dependency)"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'e2e-readonly-time'
        shell: bash
        # mcp-server-time==0.6.2 declares `mcp>=1.0.0` with no upper bound
        # and imports `McpError` from `mcp.shared.exceptions`. `mcp` 2.0.0
        # (2026-07-28) renamed that to `MCPError` and restructured its other
        # imports, so a plain `pip install mcp-server-time==0.6.2` resolves
        # whatever `mcp` is newest on the day CI runs and crashes on import
        # (verification/SOURCE.md's e2e-readonly-time row has the version
        # check). The server gets its own venv, exactly like target 6's
        # Agents-SDK shim above, with `mcp` explicitly pinned to 1.30.0 --
        # the last 1.x release that still exports `McpError` -- so it never
        # has to agree with whatever `mcp` version the campaign venv or the
        # runner's system Python carries. Prepending this venv's own bin/
        # directory to PATH (rather than editing
        # verification/third_party/e2e_readonly_time.yaml's `command:
        # mcp-server-time`) means every later step that launches the target
        # by that bare command -- the Scaffold sanity check below and the
        # real scan/generate/validate run, which reads the command from the
        # checked-in target file -- resolves it to this isolated install
        # with no further change.
        run: |
          python -m venv "$RUNNER_TEMP/tpv-time-venv"
          "$RUNNER_TEMP/tpv-time-venv/bin/python" -m pip install --quiet "mcp==1.30.0" "mcp-server-time==0.6.2"
          echo "$RUNNER_TEMP/tpv-time-venv/bin" >> "$GITHUB_PATH"

      # e2e-readonly-b reuses target 4's own binary (server-everything --
      # see verification/SOURCE.md's e2e-readonly-b row for why: a static
      # tool inventory with no write/send/delete/exec/fetch-out tool,
      # confirmed from mylonite.scan.tool_roles/tool_classifier). npx
      # fetches it on demand in the scaffold-check and run steps below, the
      # same as target 4 -- no separate install step needed.

      - name: "e2e-reference-w1: install the bundled reference app (in-process twin; see the prereg's Breadth cell 1)"
        if: steps.guard.outputs.run == 'true' && env.TPV_TARGET == 'e2e-reference-w1'
        shell: bash
        # Unlike e2e-guarded-reference's real stdio server below, this
        # target never spawns a subprocess for either twin: the in-process
        # `reference:vulnerable`/`reference:guarded` adapter
        # (reference_target_adapter.py) lazily imports `mcp_kitchen_sink`
        # INSIDE the `$MYLONITE` process itself, so it must land in the
        # SAME interpreter `$MYLONITE` runs under -- the campaign venv built
        # above, not the bare `python` on PATH (the runner's setup-python
        # install), which is a different interpreter with its own
        # site-packages. canaries.yml's plain `pip install` is fine there
        # because that workflow never builds a separate venv: mylonite
        # itself and the reference app share the one environment `python`
        # resolves to. A prior round of this workflow used that same bare
        # `python -m pip install` here, which installed the package where
        # `$MYLONITE` could never see it, and `scan` refused with "the
        # reference app target isn't installed".
        run: |
          "$RUNNER_TEMP/campaign-venv/bin/python" -m pip install "./reference_targets/mcp_kitchen_sink[mcp]"

      # --- scaffold sanity check (no provider key; see the prereg) ----------

      - name: Scaffold sanity check -- re-introspect via the unchanged CLI (not for target 3 or e2e-reference-w1; see the prereg)
        if: >-
          steps.guard.outputs.run == 'true' &&
          env.TPV_TARGET != 'tpv-streamablehttp' &&
          env.TPV_TARGET != 'e2e-reference-w1'
        shell: bash
        run: |
          case "$TPV_TARGET" in
            tpv-server-memory)
              "$MYLONITE" scan --command npx --arg -y --arg "@modelcontextprotocol/server-memory@2026.8.31" \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            tpv-mcp-redis)
              "$MYLONITE" scan --command redis-mcp-server --arg --host --arg 127.0.0.1 --arg --port --arg 6379 \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            tpv-server-everything)
              "$MYLONITE" scan --command npx --arg -y --arg "@modelcontextprotocol/server-everything@2026.8.31" \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            tpv-go-memory)
              "$MYLONITE" scan --command "$GITHUB_WORKSPACE/verification/third_party/tpv-go-memory" \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            tpv-agents-sdk-ollama)
              "$MYLONITE" scan --rest-url http://127.0.0.1:8099/chat --rest-response-path reply \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            e2e-guarded-reference)
              "$MYLONITE" scan --command mcp-kitchen-sink-guarded \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            e2e-readonly-time)
              "$MYLONITE" scan --command mcp-server-time \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
            e2e-readonly-b)
              "$MYLONITE" scan --command npx --arg -y --arg "@modelcontextprotocol/server-everything@2026.8.31" \
                --scaffold scaffold-check.yaml --scope "$TPV_TARGET" --force
              ;;
          esac

      # --- the real journey: scan, then generate+validate for targets 1-3 --

      - name: Run the real journey (scan; generate+validate too for targets 1-3)
        if: steps.guard.outputs.run == 'true'
        id: run
        shell: bash
        env:
          # The ONLY step in this job whose env: carries a REAL provider key
          # used to drive a live call (the guard step above only checks
          # presence, never uses the value).
          ANTHROPIC_API_KEY: ${{ env.TPV_PROVIDER == 'anthropic' && secrets.MYLONITE_LLM_KEY || '' }}
          OPENAI_API_KEY: ${{ env.TPV_PROVIDER == 'openai' && secrets.MYLONITE_OPENAI_KEY || '' }}
          OLLAMA_API_BASE: http://127.0.0.1:11434
          MYLONITE_MAX_TOKENS: "2048"
          TPV_MODEL: ${{ steps.model.outputs.model }}
          # scan and validate are two SEPARATE processes, each getting its
          # OWN MYLONITE_MAX_LLM_REQUESTS ceiling -- set as a one-off
          # per-command env override below (`MYLONITE_MAX_LLM_REQUESTS=...
          # "$MYLONITE" scan ...`), never a single shared step-level value,
          # since a step's `env:` can only hold one value per name and the
          # two processes need different ones (scan has more seeds to
          # drive than validate has re-drives). MYLONITE_MAX_LLM_REQUESTS
          # is Mylonite's hard request ceiling (#282): it counts every LLM
          # request the process sends, retries included, and refuses the
          # next one. A process that reaches it prints one [MYL-ABT-001]
          # line and exits 3 (NOT TESTED). This step captures that exit
          # code like any other, so a trip never fails the step; the scorer
          # reads the code from that stage's own log.
          # The pre-pilot defaults (120/80) are sized from a from-`src/`
          # estimate of realistic/worst-case calls per process -- see the
          # prereg's "Pilot procedure", which sets the REAL values from one
          # uncounted dispatch before any counted run.
          TPV_SCAN_CEILING: ${{ steps.inputs.outputs.scan_ceiling }}
          TPV_VALIDATE_CEILING: ${{ steps.inputs.outputs.validate_ceiling }}
          # --weakness-class (validated in "Validate inputs" above): a
          # single W1-W4 class, or blank for every class the target
          # declares.
          TPV_PATTERN: ${{ inputs.pattern }}
        run: |
          EXTRA_SCAN_FLAGS=()
          if [ "$TPV_TARGET" = "e2e-reference-w1" ]; then
            # Breadth cell 1 (verification/PREREG_E2E_2026_10.md): this
            # cell's class is pinned to W1 by the workflow itself -- the
            # dispatch's own `pattern` input is unused here, whatever it is
            # set to.
            EXTRA_SCAN_FLAGS+=(--weakness-class W1)
          elif [ -n "$TPV_PATTERN" ]; then
            EXTRA_SCAN_FLAGS+=(--weakness-class "$TPV_PATTERN")
          fi
          case "$TPV_TARGET" in
            tpv-server-memory)      TARGET_FILE=memory.yaml;         FULL_JOURNEY=true ;;
            tpv-mcp-redis)          TARGET_FILE=redis.yaml;          FULL_JOURNEY=true ;;
            # Its only W2 route is a tool argument, not a store-and-recall
            # pair, so there is no seed_arm; the prereg expects W2 to read
            # NOT TESTED here rather than the scan refusing to start.
            tpv-streamablehttp)     TARGET_FILE=streamablehttp.yaml; FULL_JOURNEY=true
                                    EXTRA_SCAN_FLAGS+=(--allow-no-seed-arm) ;;
            tpv-server-everything)  TARGET_FILE=everything.yaml;     FULL_JOURNEY=false ;;
            tpv-go-memory)          TARGET_FILE=go_memory.yaml;      FULL_JOURNEY=false ;;
            # Runs the full journey (verification/PREREG_E2E_2026_10.md's
            # "Fix re-test 2"): STABLE, NOT PROVEN (a candidate) on 2+/3 runs
            # per provider is this cell's bar, and only `validate` can assign
            # that label. `testkit`'s differential path already special-cases
            # `transport: rest`, so `generate`+`validate` need no change here
            # -- offline coverage: tests/plugins/test_http_adapter.py,
            # tests/plugins/test_validator_evidence_tier.py,
            # tests/test_rest_effect_probe.py.
            tpv-agents-sdk-ollama)  TARGET_FILE=agents_rest.yaml;    FULL_JOURNEY=true ;;
            # Precision cells (verification/PREREG_E2E_2026_10.md): full
            # journey, because "0 kept" is a validate-stage verdict, not a
            # bare scan-findings count.
            e2e-guarded-reference)  TARGET_FILE=e2e_guarded_reference.yaml; FULL_JOURNEY=true ;;
            e2e-readonly-time)      TARGET_FILE=e2e_readonly_time.yaml;     FULL_JOURNEY=true ;;
            e2e-readonly-b)         TARGET_FILE=e2e_readonly_b.yaml;        FULL_JOURNEY=true ;;
            # Breadth cell 1: the in-repo reference app is not a
            # verification/third_party/*.yaml target, so TARGET_FILE stays
            # empty -- the scan/generate/validate commands below branch on
            # that to dispatch `reference:vulnerable` directly, with no
            # --target-file/--authorize (the in-process reference adapter
            # takes neither; see cli.py's `is_reference`/`is_custom`
            # routing).
            e2e-reference-w1)      TARGET_FILE="";                        FULL_JOURNEY=true ;;
            *) echo "::error::unknown target $TPV_TARGET"; exit 1 ;;
          esac

          # Nothing below lets scan/generate/validate's own exit code, OR a
          # clean "nothing matched" from a glob under this step's
          # `-eo pipefail`, fail THIS STEP -- each command is captured with
          # `set +e` / PIPESTATUS and logged, never re-raised, and every
          # glob below is `compgen -G ... || true`, never a bare `ls`. A
          # budget/provider abort, a rejected validate, an actual crash, OR
          # a clean scan that found nothing to generate from are all
          # legitimate, scoreable outcomes (see scripts/score_third_party.py),
          # not step failures; letting any of them fail this step would skip
          # the scoring and cost steps that follow and silently lose the
          # result -- including the expected, honest "the target resisted"
          # outcome, which must read green, not red.
          # Each stage also gets its own log (scan.log, generate.log,
          # validate.log) beside the combined run.log. The scorer reads a
          # stage's reason codes only from that stage's log, so a validate
          # abort is never scored with scan's codes and N=3 agreement keys
          # are not split by what scan happened to skip. validate.log
          # existing is also how the scorer knows validate ran.
          mkdir -p out
          set +e
          if [ -z "$TARGET_FILE" ]; then
            # Breadth cell 1: the bundled reference target, no
            # --target-file/--authorize (see the case statement above).
            MYLONITE_MAX_LLM_REQUESTS="$TPV_SCAN_CEILING" "$MYLONITE" scan \
              reference:vulnerable --model "$TPV_MODEL" --max-llm-calls 60 \
              --output-dir out "${EXTRA_SCAN_FLAGS[@]}" 2>&1 | tee run.log scan.log
          else
            MYLONITE_MAX_LLM_REQUESTS="$TPV_SCAN_CEILING" "$MYLONITE" scan \
              --target-file "verification/third_party/$TARGET_FILE" \
              --authorize "$TPV_TARGET" --model "$TPV_MODEL" --max-llm-calls 60 \
              --output-dir out "${EXTRA_SCAN_FLAGS[@]}" 2>&1 | tee run.log scan.log
          fi
          scan_rc=${PIPESTATUS[0]}
          set -e
          echo "scan exited $scan_rc" >> run.log
          scan_dir="$(find out -maxdepth 1 -mindepth 1 -type d | head -1)"
          echo "score_dir=${scan_dir:-out}" >> "$GITHUB_OUTPUT"
          # A SEPARATE output from score_dir (never overwritten below): the
          # REAL scan output directory `scan --output-dir` wrote, with its
          # own full `attempts`/`calibration` blocks -- unlike `generated/`,
          # which `generate` leaves only a trimmed `{model, provider}` copy
          # of scan_report.json beside the test. score_dir points at
          # `generated` once generate+validate succeed (below); this output
          # always still points at the original scan directory, so the
          # Score step can read calibration/proof_level/exercised from the
          # real report even when scoring a validated run.
          echo "scan_dir=${scan_dir:-out}" >> "$GITHUB_OUTPUT"

          # Targets 4-5 are N=1 smoke cells (prereg: "claim no verdict") --
          # scan only. generate/validate need an actual finding to run on,
          # which a smoke cell makes no promise of producing. Target 6
          # (tpv-agents-sdk-ollama) is promoted to the full journey by
          # verification/PREREG_E2E_2026_10.md's "Fix re-test 2" -- see the
          # FULL_JOURNEY case statement above.
          if [ "$FULL_JOURNEY" = "true" ] && [ -n "$scan_dir" ]; then
            # Pass ONE exploit file explicitly (sorted first by pattern_id),
            # never `--latest`/a bare scan dir: with 2+ findings, `generate`
            # writes each into its own generated/<slug>/ subdirectory, and
            # `validate generated` (the parent) then finds no exploit_*.json
            # there and fails -- a real bug a prior round of this workflow
            # had. Passing one exploit path keeps generate in its
            # single-finding mode, which writes flat into --out. Known,
            # documented scope limit: with multiple findings in one scan,
            # only the first is validated and scored this round.
            # `compgen -G` (not `ls`) to list matches: under this step's
            # `-eo pipefail`, `ls` on a genuinely clean scan (no
            # exploit_*.json at all -- the expected resist outcome) exits
            # non-zero even with its own message redirected away, and that
            # non-zero status propagates through the pipe into `sort`/`head`
            # and kills this whole step, exactly the bug this `|| true`
            # closes (a clean resist must never read as a failed job).
            exploit_path="$(compgen -G "$scan_dir/exploit_*.json" | sort | head -1 || true)"
            if [ -n "$exploit_path" ]; then
              set +e
              if [ -z "$TARGET_FILE" ]; then
                "$MYLONITE" generate "$exploit_path" --out generated \
                  --prove-control 2>&1 | tee -a run.log generate.log
              else
                "$MYLONITE" generate "$exploit_path" --out generated \
                  --target-file "verification/third_party/$TARGET_FILE" --prove-control 2>&1 | tee -a run.log generate.log
              fi
              generate_rc=${PIPESTATUS[0]}
              set -e
              echo "generate exited $generate_rc" >> run.log
              if [ "$generate_rc" -eq 0 ]; then
                set +e
                if [ -z "$TARGET_FILE" ]; then
                  MYLONITE_MAX_LLM_REQUESTS="$TPV_VALIDATE_CEILING" "$MYLONITE" validate generated \
                    --model "$TPV_MODEL" --iterations 3 2>&1 | tee -a run.log validate.log
                else
                  MYLONITE_MAX_LLM_REQUESTS="$TPV_VALIDATE_CEILING" "$MYLONITE" validate generated \
                    --target-file "verification/third_party/$TARGET_FILE" --authorize "$TPV_TARGET" \
                    --model "$TPV_MODEL" --iterations 3 2>&1 | tee -a run.log validate.log
                fi
                validate_rc=${PIPESTATUS[0]}
                set -e
                echo "validate exited $validate_rc" >> run.log
                # validate ALWAYS writes validation_report.json next to the
                # test (kept or not) -- unlike `gate`'s orchestrator, which
                # only persists one for a KEPT finding. Score THIS
                # directory, not the scan directory, so a not-kept result
                # is reachable.
                echo "score_dir=generated" >> "$GITHUB_OUTPUT"
              elif grep -q "found no exploits" generate.log; then
                echo "::notice::generate found no exploits to emit a test from -- a clean no-finding scan; scoring the scan directory."
              else
                echo "::warning::generate exited $generate_rc without the expected 'found no exploits' message -- a real failure, not a clean no-finding result; scoring the scan directory, which the scorer may read as a product defect given the traceback rule."
              fi
            else
              echo "::notice::scan_report.json claims a finding but no exploit_*.json file was found under $scan_dir -- scoring the scan directory."
            fi
          fi

      # --- score, cost, publish the prereg this run was judged against -----
      # Both steps run with `if: always()` (plus the guard's own output
      # check): scan/generate/validate's exit codes never fail the run step
      # above, but `always()` means score.json/cost.json are still written
      # even if some EARLIER, unrelated step (checkout, the wheel build, a
      # server launch) failed before run.log ever existed -- the scorer's
      # own missing-report path handles that case (PRODUCT_DEFECT or
      # INVALID, never silently nothing), and compute_run_cost.py writes a
      # zero-cost cost.json with a reason instead of raising when run.log
      # itself is missing (never the same thing as a log that EXISTS with
      # no spend line, which still raises -- see that script's docstring).

      - name: Score the run against the prereg
        if: always() && steps.guard.outputs.run == 'true'
        shell: bash
        env:
          TPV_SCORE_DIR: ${{ steps.run.outputs.score_dir }}
          # The REAL scan output directory (never overwritten, unlike
          # score_dir) -- see that output's own comment above. Lets the
          # scorer read calibration/proof_level/exercised from the full
          # report even when TPV_SCORE_DIR is `generated` (a validated
          # run), whose own scan_report.json is only generate's trimmed
          # copy.
          TPV_ORIGINAL_SCAN_DIR: ${{ steps.run.outputs.scan_dir }}
          # So the scorer reports this cell's own weakness class's
          # fired/resisted/kept counts (e.g. "w2" for the third-party
          # injection breadth cell) instead of always defaulting to "w1".
          TPV_PATTERN: ${{ inputs.pattern }}
        run: |
          score_pattern="$TPV_PATTERN"
          if [ "$TPV_TARGET" = "e2e-reference-w1" ]; then
            # Breadth cell 1: the dispatch's own `pattern` input is unused
            # for this cell (see "Run the real journey" above) -- score it
            # as W1 regardless of what was dispatched.
            score_pattern="W1"
          fi
          "$RUNNER_TEMP/campaign-venv/bin/python" scripts/score_third_party.py score \
            "${TPV_SCORE_DIR:-out}" --target "$TPV_TARGET" --pattern "$score_pattern" \
            --scan-dir "${TPV_ORIGINAL_SCAN_DIR:-out}" \
            --run-log run.log --scan-log scan.log --validate-log validate.log \
            --out score.json

      - name: Compute this run's $ cost from the printed token counts
        if: always() && steps.guard.outputs.run == 'true'
        shell: bash
        env:
          TPV_MODEL: ${{ steps.model.outputs.model }}
          TPV_COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          case "$TPV_PROVIDER" in
            ollama) IN_RATE=0; OUT_RATE=0 ;; # local model, no provider cost, tier-independent
          esac
          if [ "$TPV_PROVIDER" != "ollama" ]; then
            case "$TPV_TIER:$TPV_PROVIDER" in
              small:anthropic) IN_RATE=1.0;  OUT_RATE=5.0 ;;   # claude-haiku-4-5 (verification/README.md)
              small:openai)    IN_RATE=0.15; OUT_RATE=0.60 ;;  # gpt-4o-mini (the prereg)
              # the breadth tier's mid model (verification/PREREG_E2E_2026_10.md's "Models"
              # and "OpenAI mid tier" sections). gpt-5.1, not gpt-6.1-sol --
              # see the "Resolve the fixed model" step above for why.
              mid:anthropic)   IN_RATE=2.0;  OUT_RATE=10.0 ;;  # claude-sonnet-5 (claude.com/pricing)
              mid:openai)      IN_RATE=1.25; OUT_RATE=10.00 ;; # gpt-5.1 (developers.openai.com/api/docs/pricing)
            esac
          fi
          python scripts/compute_run_cost.py run.log \
            --model "$TPV_MODEL" --in-rate "$IN_RATE" --out-rate "$OUT_RATE" \
            --ref "${TPV_COMMIT_SHA:-unknown}" --out cost.json

      - name: Record the prereg commit this run was judged against
        if: always() && steps.guard.outputs.run == 'true'
        shell: bash
        run: git log -1 --format=%H -- verification/PREREG_THIRD_PARTY_2026_10.md > prereg.sha

      - name: Upload this cell's artefacts
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-${{ inputs.target }}-${{ inputs.provider }}-${{ inputs.tier }}
          path: |
            out/**
            generated/**
            run.log
            scan.log
            generate.log
            validate.log
            score.json
            cost.json
            prereg.sha
            scaffold-check.yaml
          if-no-files-found: warn

name: Release

on:
  push:
    tags:
      # One pattern, matching any vX.Y.Z. `+` here is GitHub filter-pattern
      # syntax ("one or more of the preceding character"), not regex, and `.` is
      # a literal dot — the same idiom release-kitchen-sink.yml already uses.
      #
      # This deliberately excludes prereleases. The previous `v[1-9]*.*.*`
      # matched `v1.0.0rc1` (the trailing `*` swallowed `0rc1`), which would have
      # gone straight to PyPI as a normal release. Filter patterns must match the
      # whole ref, so `v1.0.0rc1` no longer matches anything here.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    # Escape hatch: a tag can only be pushed once, so without this a failure in a
    # late job (a GitHub outage during github-release, say) could only be retried
    # by inventing a throwaway version.
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to re-run the release for"
        required: true

permissions:
  contents: read

jobs:
  gate:
    # Runs FIRST, before anything is built or uploaded. Every irreversible step
    # in this workflow is downstream of it.
    #
    # It exists because PyPI uploads cannot be undone and version numbers cannot
    # be reused. Previously nothing compared the tag to the package version at
    # all: `git tag v9.9.9 && git push` would have built and published 0.7.8
    # under a v9.9.9 release, and the only complaint would have come from
    # github-release afterwards — with the wrong file already on PyPI.
    #
    # Standard-library only, so it needs no `pip install` and finishes in seconds.
    name: Version consistency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag, version.py, pyproject and CHANGELOG all agree
        # RELEASE_TAG via env, not `${{ }}` inside the script. On
        # workflow_dispatch `inputs.tag` is free text typed by whoever started
        # the run, and an expression is pasted in before bash parses the line --
        # so a tag containing shell syntax would execute here, in the one job
        # every irreversible step of this workflow depends on.
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/prepare_release.py --check --tag "$RELEASE_TAG"
      - name: A minor/major release has committed verification results
        # CI cannot RUN the verification campaign: it needs a provider key, and
        # deliberately no key is configured as a repository secret. But it can
        # check that someone did.
        #
        # This is what stops the scorecard decaying again. The published figures
        # went unversioned across fifteen releases with nothing to signal the
        # drift, because "re-measure each release" was discipline rather than a
        # gate. Discipline is what already failed.
        #
        # Minor/major only. Patch releases are exempt by design: gating every
        # patch on a campaign would make the campaign the thing people route
        # around, and a rule that gets routed around protects nothing.
        run: python scripts/check_verification_freshness.py

  ci:
    # The full suite, against the tagged commit. Before this, a tag published a
    # commit that CI had only ever tested on main — usually the same tree, but
    # nothing enforced it. `uses:` on a tag ref resolves to THAT TAG's copy of
    # ci.yml, so a release is verified by the CI definition it shipped with.
    name: CI on the tagged commit
    needs: gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist + wheel
    needs: [gate, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          # No `cache: pip` here, unlike the CI jobs. This job produces the
          # artifact that gets published to PyPI, and the Actions cache is
          # writable from any branch: a cache entry poisoned by an earlier run
          # could be restored into this build and end up inside a signed
          # release. The cache saves seconds on a workflow that runs a few times
          # a year. Not a trade worth making.
      - name: Build
        # twine must stay current: 6.2.0 and earlier overwrite packaging's
        # _VALID_METADATA_VERSIONS with a hardcoded list ending at "2.4" and so
        # reject the Metadata-Version 2.5 current hatchling emits.
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Only on the rehearsal leg. A re-run (workflow_dispatch) would
          # otherwise 409 here on files TestPyPI already has and never reach the
          # step that actually matters. PyPI below stays strict on purpose: a
          # duplicate upload THERE means something is genuinely wrong.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  pypi-smoke:
    # Everything above this point can be, and has been, tested against a
    # local build or TestPyPI. Nothing before now has proven that the demo the
    # README tells a new user to run actually works against what PyPI just
    # served the world -- index propagation lag, a Trusted Publishing
    # misconfiguration, or a `[demo]` extra that resolves differently off
    # PyPI than it did from the checkout would all be invisible otherwise.
    #
    # This mirrors ci.yml's `demo` job (same matrix, same 80-column check,
    # same greps) with one deliberate difference: `--from` names the
    # published `mylonite[demo]==X.Y.Z`, not `.[demo]` from a checkout, so a
    # green run here means the artifact on PyPI -- not the source tree --
    # produces the finding count and the replay-mode line a user would see.
    #
    # Independent of `github-release` on purpose: a slow PyPI index or a
    # transient runner problem here must not hold up the release notes.
    name: Demo from PyPI
    needs: publish-pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        # Git Bash on Windows, so `set -o pipefail`, `tee` and `grep` below
        # mean the same thing on both runners -- see ci.yml's `demo` job.
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      COLUMNS: "80"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      # The newest supported Python, so the one-liner is proven where a new
      # user is most likely to be. uvx runs on the interpreter on PATH.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # uv comes from PyPI at a pinned version: the repository's Actions
      # policy allows only GitHub-owned actions, so there is no setup-uv step.
      - name: Install uv
        run: python -m pip install "uv==0.12.19"
      - name: Run the offline demo through uvx, against the published release
        # The retry loop covers PyPI index lag after a Trusted Publishing
        # upload, not a broken demo: each attempt's output goes to out.txt
        # only via `tee`, so a failed attempt's partial or empty output is
        # overwritten by the next attempt rather than read by the greps
        # below. `pipefail` makes the pipeline report the demo's exit status,
        # not `tee`'s, so `break` only fires when the demo succeeded. After the
        # fifth failed attempt the explicit `exit 1` fails the step with an
        # error line, instead of the greps below reading stale or missing
        # output; earlier failures wait 30 seconds and retry.
        run: |
          set -o pipefail
          v="${RELEASE_TAG#v}"
          for i in 1 2 3 4 5; do
            uvx --no-cache --from "mylonite[demo]==$v" mylonite demo | tee out.txt && break
            if [ "$i" = 5 ]; then
              echo "::error::demo failed against mylonite[demo]==$v from PyPI after 5 attempts."
              exit 1
            fi
            sleep 30
          done
      - name: The vulnerable twin must actually find something
        # Same assertions as ci.yml's `demo` job -- see its comments for why
        # exit code alone is not enough and why a stray ellipsis means the
        # 80-column output was cut.
        run: |
          if ! grep -Eq '[1-9][0-9]* exploits on vulnerable' out.txt; then
            echo "::error::demo did not report a non-zero finding count on the VULNERABLE twin."
            sed -n '1,40p' out.txt
            exit 1
          fi
          if ! grep -q "mode: replay" out.txt; then
            echo "::error::demo did not report replay mode; it may have attempted a live call."
            exit 1
          fi
          if grep -Fq '…' out.txt; then
            echo "::error::demo output is truncated at 80 columns (found an ellipsis)."
            grep -Fn '…' out.txt
            exit 1
          fi

  github-release:
    # A pushed tag alone does NOT show up as a GitHub Release (a separate
    # feature from tags) -- without this job, `gh release list` / the
    # /releases/latest API / the repo's Releases page keep pointing at
    # whichever tag was last released manually, growing more stale with
    # every tag-only release. See CONTRIBUTING.md's "Cutting a release".
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # On workflow_dispatch, GITHUB_REF_NAME is the branch the run was started
      # from, not a tag -- so every use of the tag has to go through this.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Extract this version's CHANGELOG section
        run: |
          version="${RELEASE_TAG#v}"
          # The header is "## [X.Y.Z] - YYYY-MM-DD" -- match the "## [X.Y.Z]"
          # prefix, not exact equality (an earlier version of this job used
          # `$0 == ver`, which never matched the dated header and silently
          # produced an empty release body for v0.7.8).
          awk -v ver="## [$version]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Backstop only -- the `gate` job already rejected a missing or
          # blank section before anything was published. `grep -q .` rather than
          # `[ -s ]`: a section of nothing but newlines is non-empty as a file,
          # so `-s` passed it and produced a Release with a whitespace body.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No CHANGELOG.md content for $version -- refusing to create a Release with an empty body."
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md

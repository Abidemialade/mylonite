# Live smoke test: proves, against a real model and a real `npx`-launched
# MCP server (no mocked subprocess, no scripted completion_fn), that the
# #217 calibration fix actually works end to end. Two runs of the real
# `mylonite scan` CLI:
#
#   1. the docs-following fixture (tests/fixtures/issue217/filesystem.yaml)
#      -- calibration must fail with MYL-INC-005, and the scanned class must
#      never silently read RESISTED/RESISTED (server-reported);
#   2. its corrected twin (filesystem.corrected.yaml) -- calibration must
#      certify a tool.
#
# tests/integration/test_issue217.py proves the same two things OFFLINE,
# against a scripted completion_fn and a monkeypatched MCP session -- this
# workflow is the live counterpart: no mocks, a real npx server subprocess,
# a real LLM call. Manual dispatch only: it spends tokens and needs
# the MYLONITE_LLM_KEY repo secret, so it never runs on a PR or a schedule.
name: live-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: "litellm model id to drive the scan (e.g. anthropic/claude-haiku-4-5-20251001)"
        required: true
      max_llm_calls:
        description: "LLM call budget per scan"
        default: "40"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.MYLONITE_LLM_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Guard -- skip (not fail) a dispatch with no key configured
        id: guard
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::MYLONITE_LLM_KEY is not set; skipping the live smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Dispatch inputs arrive through env, never through `${{ }}` inside a
      # run: script -- they are free text and get substituted before bash
      # parses the line, so a malicious `model`/`max_llm_calls` could carry
      # shell syntax into a job that holds a provider key (same rule as
      # verification.yml's Layer 2 step).
      - name: Scan A -- the docs-following fixture (expect MYL-INC-005)
        if: steps.guard.outputs.run == 'true'
        env:
          MODEL: ${{ inputs.model }}
          N: ${{ inputs.max_llm_calls }}
        run: |
          mkdir -p .mylonite-issue217/sandbox
          mylonite scan --target-file tests/fixtures/issue217/filesystem.yaml \
            --authorize issue217-filesystem --model "$MODEL" --weakness-class W4 \
            --max-llm-calls "$N" --output-dir out-docs
          python scripts/check_live_smoke.py out-docs --expect inc005 --weakness-class W4
      - name: Scan B -- the corrected fixture (expect a calibration certificate)
        if: steps.guard.outputs.run == 'true'
        env:
          MODEL: ${{ inputs.model }}
          N: ${{ inputs.max_llm_calls }}
        run: |
          mkdir -p sandbox
          mylonite scan --target-file tests/fixtures/issue217/filesystem.corrected.yaml \
            --authorize issue217-filesystem-corrected --model "$MODEL" --weakness-class W4 \
            --max-llm-calls "$N" --output-dir out-corrected
          python scripts/check_live_smoke.py out-corrected --expect certified --weakness-class W4
      - name: Upload scan artefacts
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-smoke-scans
          path: |
            out-docs/**
            out-corrected/**

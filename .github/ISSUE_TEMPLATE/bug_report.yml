name: Bug report
description: Something in Mylonite doesn't work the way it claims to.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in the fields below.
        For security-sensitive issues, please use the private security
        advisory channel listed in SECURITY.md instead of this template.

  - type: input
    id: mylonite-version
    attributes:
      label: Mylonite version
      description: Output of `mylonite version`
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Exact command
      description: The full `mylonite ...` command that triggered the bug, flags included.
      placeholder: "mylonite scan --target-file app.yaml --authorize my-app"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: A short snippet, command sequence, or config that reproduces the bug.
      render: shell
    validations:
      required: true

  - type: input
    id: reason-codes
    attributes:
      label: Reason codes
      description: >-
        Any `MYL-...` codes in the output (for example `MYL-NT-017`, `MYL-ABT-001`).
        See `docs/reason-codes.md`. Leave blank if the output showed none.
      placeholder: "MYL-NT-017"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please redact any secrets before pasting.
      render: shell
    validations:
      required: false

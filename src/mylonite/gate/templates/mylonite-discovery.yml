# Mylonite discovery — the EXPENSIVE, non-blocking job.
# Runs nightly (and on demand): full scan -> generate -> validate, and on a NEW
# kept exploit opens a gating PR that adds/updates the __GATE_DIR__/ test plus
# a suggested-fix description. Never blocks merges.
#
# Requires the MYLONITE_API_KEY secret, mapped below to the credential
# variable the model that scaffolded this file actually needs. Uses the
# built-in GITHUB_TOKEN to open the PR — no extra secret needed. Pinned to
# the model this gate run used; set a MYLONITE_MODEL repository variable to
# change it without editing this file. Changing providers also needs a
# fresh `gate --workflows` run, so the key mapping below is re-baked too.
name: Mylonite discovery
on:
  schedule:
    - cron: "17 4 * * *"   # nightly at 04:17 UTC; adjust to taste
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: mylonite-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: __RUNS_ON__
    timeout-minutes: 45
    steps:
      # This job pushes the gate branch and opens the PR itself, but the
      # target process runs (via `mylonite gate`, below) BEFORE that push --
      # so the checkout must not leave a write-capable credential sitting in
      # .git/config for the target to read while it runs. `gh auth
      # setup-git`, right before the one step that pushes, configures git to
      # fetch a token from `gh` (which reads GH_TOKEN, already scoped to that
      # step) at push time instead -- no credential value is ever written to
      # disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
#__RUNTIME_SETUP_STEP__
      - name: Install mylonite + pytest
        run: pip install "mylonite==__MYLONITE_VERSION__" pytest -c .github/workflows/mylonite-constraints.txt
      - name: Configure git identity for the gating PR
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
#__TARGET_SECRETS_CHECK_STEP__
      - name: Discover -> generate -> validate -> open gating PR
        # The variable travels through env, not an expression inside `run:`:
        # GitHub pastes an expression into the script text before bash parses
        # it, so a value holding a quote or `;` would become shell syntax.
        # The credential/model env vars are scoped to this one step -- the
        # step that actually makes a live model call and opens the PR --
        # not the whole job. `shell: bash` is explicit, not the job default,
        # because this job's `runs-on:` above can be a self-hosted Windows
        # label, whose default shell is pwsh.
        shell: bash
        env:
          MYLONITE_AUTHORIZE: ${{ vars.MYLONITE_AUTHORIZE }}
          MYLONITE_MODEL: ${{ vars.MYLONITE_MODEL || '__MYLONITE_MODEL__' }}
          __LLM_KEY_ENV__: ${{ secrets.MYLONITE_API_KEY }}
#__LLM_EXTRA_ENV__
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYLONITE_REDRIVE_ATTEMPTS: "3"
          # Optional: extra LLM request headers (e.g. a workspace id), as
          # NAME=VALUE pairs. Empty when the repository secret isn't set.
          MYLONITE_LLM_HEADERS: ${{ secrets.MYLONITE_LLM_HEADERS }}
#__TARGET_SECRETS_ENV_LINES__
        run: |
          # No credential is persisted by the checkout (persist-credentials:
          # false, above). This configures git's credential helper to ask
          # `gh` for a token (which reads GH_TOKEN from this step's own env)
          # -- it writes no credential value to disk itself; git only
          # invokes the helper when it actually pushes, inside `mylonite
          # gate` below, by which point the target it ran has already
          # stopped.
          gh auth setup-git
          set +e
          mylonite gate --target-file __GATE_DIR__/target.yaml \
            --authorize "$MYLONITE_AUTHORIZE" --open-pr
          code=$?
          set -e
          case "$code" in
            0)  echo "::notice::Mylonite discovery: nothing found." ;;
            9)  echo "::notice::Mylonite kept a proven finding; see the gate pull request." ;;
            10) echo "::warning::Mylonite found unproven candidates (not committed); the log says how to prove each." ;;
            *)  exit "$code" ;;
          esac
